name: Daily demo-account reset

# The demo account (DEMO_LOGIN_EMAIL) auto-restores to its baseline snapshot
# one hour after each demo sign-in. The login path runs the check lazily, but
# if nobody signs in again the junk would linger — this daily job is the
# backstop that runs the same check on a clock. A no-op whenever the demo
# login is unconfigured or the data is already clean.
#
# Required repo secret (Settings → Secrets and variables → Actions):
#   CRON_SECRET — must match the CRON_SECRET Pages secret set on the project

on:
  schedule:
    # Daily at 04:05 UTC (~midnight EST) — off-peak, clear of the 03:00 backup.
    - cron: '5 4 * * *'
  workflow_dispatch:  # Manual trigger from Actions tab

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run demo reset check
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          resp=$(curl -sS -X POST https://showpicker.club/api/admin-demo-reset \
            -H "Content-Type: application/json" \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            -d '{}' \
            -w $'\n%{http_code}')
          http=$(printf '%s' "$resp" | tail -n1)
          body=$(printf '%s' "$resp" | sed '$d')
          echo "HTTP $http: $body"
          # Fail loudly on anything that isn't a clean 200 — grepping the body
          # for one known error string let a Cloudflare bot challenge (403 with
          # an HTML interstitial) pass green for two days in 2026-09 while no
          # reset actually ran.
          if [ "$http" != "200" ]; then
            if printf '%s' "$body" | grep -q '_cf_chl_opt\|Just a moment'; then
              echo "::error::Cloudflare served a bot challenge to the GitHub runner — the request never reached the Function. Fix is in the zone's Security settings (dashboard), not the secret."
            else
              echo "::error::demo reset returned HTTP $http (CRON_SECRET rejected, or endpoint error)"
            fi
            exit 1
          fi
          if printf '%s' "$body" | grep -q '"error"'; then
            echo "::error::demo reset returned an error body"
            exit 1
          fi
