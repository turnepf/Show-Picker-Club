name: Deploy to Cloudflare Pages

# Auto-deploys `public/` + `functions/` to the `shows` Pages project on every
# push to main. Replaces running `wrangler pages deploy` from a local Mac.
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN   — needs Pages:Edit + D1:Edit on the account
#   CLOUDFLARE_ACCOUNT_ID  — 851a39c5483b9aef842112771b5f8542

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Was 5, which the smoke retries above can now come close to on a slow run.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install wrangler
        run: npm install -g wrangler@latest

      # Apply any pending D1 migrations BEFORE the code that depends on them
      # goes live. Self-tracked in a schema_migrations table; baselines the
      # existing migrations on first run. See scripts/apply-migrations.sh.
      - name: Apply pending D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/apply-migrations.sh

      - name: Deploy to Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler pages deploy public \
            --project-name=shows \
            --branch=main \
            --commit-dirty=true

      # Cloudflare's edge is not serving the new deploy the instant wrangler
      # returns, and a single probe 15 seconds later reported failures that
      # were really just the previous bundle still answering — a route added
      # by this very deploy 405'd where the new code answers 401. So retry:
      # only a site that is still wrong after a couple of minutes is a failing
      # deploy. A genuine break still reports, just two minutes later.
      - name: Post-deploy smoke test
        run: |
          sleep 15  # let the deploy propagate
          for attempt in 1 2 3 4; do
            if bash scripts/smoke.sh https://showpicker.club; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "Attempt $attempt failed — the edge may still be serving the previous deploy. Retrying in 30s."
              sleep 30
            fi
          done
          echo "Smoke test still failing after 4 attempts over ~2 minutes."
          exit 1
