name: PR checks

# The gate that runs BEFORE a change ships — which the post-deploy smoke test,
# by definition, cannot. Deterministic jobs only:
#
#   static   — repo-shape invariants (scripts/check-static.sh): every API
#              endpoint gated, redirects present, AASA well-formed, no retired
#              web pages back under public/.
#   swift    — ShowPickerCore unit tests on Linux. The package is deliberately
#              Foundation-only and UI-free so this needs no macOS runner (macOS
#              minutes bill at 10x on a private repo). SessionScope's teardown
#              tests are the regression net for the 2026-08 logout bug.
#   webauthn — passkeys, two suites. webauthn-test.mjs covers the signature
#              verification (hand-rolled, because this stack has no npm);
#              passkey-flow-test.mjs drives the real endpoint handlers against
#              a real SQLite database for replay and cross-member isolation.
#              Both decide who gets a session, so a forged assertion being
#              accepted has to fail a test, not a code review.
#   roku     — BrighterScript validation of the Roku channel, plus the manifest
#              and artwork checks that certification would otherwise catch. Roku ships no
#              simulator, so until this existed the only way to find a typo, a
#              call to a function that isn't there, or an onChange handler with
#              no handler was to sideload and read a crash over telnet. `bsc`
#              resolves every call against its real component scope, which is
#              the whole class of bug that used to reach the device.
#   authcodes — the email login/signup code flow, same harness, with a fake
#              Resend that refuses reserved domains the way the real one does.
#              App Review rejected tvOS 1.2 over a code that never arrived;
#              that failure now has a test. Also carries the pure-module suites
#              that need no database — vibe matching, and networks-test.mjs,
#              which catches an alias claimed by two services and the iOS
#              picker's copy of the list drifting from the server's.
#
# The judgement half lives in pr-review.yml.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push supersedes the old run rather than queuing behind it.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Static invariants
        run: bash scripts/check-static.sh

  webauthn:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Passkey signature verification
        run: node scripts/webauthn-test.mjs
      - name: Passkey endpoint flows
        run: node scripts/passkey-flow-test.mjs

  authcodes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Email login and signup code flows
        run: node scripts/auth-code-flow-test.mjs
      - name: Activity feed scoping and gating
        run: node scripts/activity-feed-test.mjs
      - name: Member roster order counts app opens
        run: node scripts/members-order-test.mjs
      - name: Admin member detail gating and scoping
        run: node scripts/admin-member-detail-test.mjs
      - name: Reporting platform breakdown counts people
        run: node scripts/reporting-platform-test.mjs
      - name: Vibe scoping and the taste exclusion
        run: node scripts/vibe-scope-test.mjs
      - name: Vibe cluster matching
        run: node scripts/vibe-match-test.mjs
      - name: Canonical networks and the iOS picker copy
        run: node scripts/networks-test.mjs
      - name: Amazon links reach the show, and a bad id is never invented
        run: node scripts/amazon-url-test.mjs
      - name: Favorite actors, the rating backlog, and what counts as trending
        run: node scripts/favorite-actors-test.mjs
      - name: Trending is a daily snapshot served from cache
        run: node scripts/trending-cache-test.mjs
      - name: Group recommendations stay pull-only and group-scoped
        run: node scripts/group-suggestions-test.mjs
      - name: Group icons are curated, any member may edit, change notice is once
        run: node scripts/group-icons-test.mjs
      - name: Enrichment honors the member's exact TMDB pick
        run: node scripts/enrich-identity-test.mjs
      - name: Movie enrichment selects on every field it writes
        run: node scripts/enrich-movie-detail-test.mjs
      - name: IMDb id, status, free services and characters are stored, hot lists first
        run: node scripts/enrich-imdb-status-test.mjs
      - name: Cross-library search filters server-side without widening scope
        run: node scripts/shows-all-search-test.mjs
      - name: A row you may not write is a row you may not read
        run: node scripts/shows-authz-test.mjs
      - name: A group invite is bounded, revocable, and not cross-site redeemable
        run: node scripts/group-invite-lifecycle-test.mjs
      - name: Upstream spend is metered per member, and households are joined by invite
        run: node scripts/spend-limits-test.mjs
      - name: The cron secret reaches two url-cleanup actions, and they decide nothing
        run: node scripts/url-cleanup-authz-test.mjs
      - name: A member's service pick outranks the link a machine fetched
        run: node scripts/show-edit-network-test.mjs
      - name: MCP server and OAuth give an AI app the member's permissions, no more
        run: node scripts/mcp-test.mjs
      - name: Club-wide queries are admin-only, a spec rather than SQL, and keep memos unreadable
        run: node scripts/admin-query-test.mjs
      - name: Admin fix tools keep the row's identity, the member's memos and updated_at
        run: node scripts/admin-fix-tools-test.mjs

  roku:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      # roku/ carries its own package.json on purpose — the web side of this
      # repo has no build step and that stays true.
      - name: Install Roku tooling
        working-directory: roku
        run: npm ci
      - name: Validate the Roku channel
        working-directory: roku
        run: npx bsc --project bsconfig.json
      # bsc validates BrightScript, not the manifest. Wrong artwork sizes and
      # missing required attributes are a certification rejection days later,
      # and run perfectly on a sideloaded device in the meantime.
      - name: Roku manifest and channel artwork
        run: node scripts/roku-manifest-test.mjs

  listimport:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: List import parse and commit
        run: node scripts/import-list-test.mjs

  swift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: swift:5.9
    steps:
      - uses: actions/checkout@v6
      - name: ShowPickerCore tests
        working-directory: ShowPickerCore
        run: swift test
