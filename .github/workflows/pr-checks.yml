name: PR checks

# The gate that runs BEFORE a change ships — which the post-deploy smoke test,
# by definition, cannot. Two deterministic jobs:
#
#   static   — repo-shape invariants (scripts/check-static.sh): every API
#              endpoint gated, redirects present, AASA well-formed, no retired
#              web pages back under public/.
#   swift    — ShowPickerCore unit tests on Linux. The package is deliberately
#              Foundation-only and UI-free so this needs no macOS runner (macOS
#              minutes bill at 10x on a private repo). SessionScope's teardown
#              tests are the regression net for the 2026-08 logout bug.
#   webauthn — passkeys, two suites. webauthn-test.mjs covers the signature
#              verification (hand-rolled, because this stack has no npm);
#              passkey-flow-test.mjs drives the real endpoint handlers against
#              a real SQLite database for replay and cross-member isolation.
#              Both decide who gets a session, so a forged assertion being
#              accepted has to fail a test, not a code review.
#   authcodes — the email login/signup code flow, same harness, with a fake
#              Resend that refuses reserved domains the way the real one does.
#              App Review rejected tvOS 1.2 over a code that never arrived;
#              that failure now has a test. Also carries the pure-module suites
#              that need no database — vibe matching, and networks-test.mjs,
#              which catches an alias claimed by two services and the iOS
#              picker's copy of the list drifting from the server's.
#
# The judgement half lives in pr-review.yml.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push supersedes the old run rather than queuing behind it.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Static invariants
        run: bash scripts/check-static.sh

  webauthn:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Passkey signature verification
        run: node scripts/webauthn-test.mjs
      - name: Passkey endpoint flows
        run: node scripts/passkey-flow-test.mjs

  authcodes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Email login and signup code flows
        run: node scripts/auth-code-flow-test.mjs
      - name: Activity feed scoping and gating
        run: node scripts/activity-feed-test.mjs
      - name: Admin member detail gating and scoping
        run: node scripts/admin-member-detail-test.mjs
      - name: Reporting platform breakdown counts people
        run: node scripts/reporting-platform-test.mjs
      - name: Vibe scoping and the taste exclusion
        run: node scripts/vibe-scope-test.mjs
      - name: Vibe cluster matching
        run: node scripts/vibe-match-test.mjs
      - name: Canonical networks and the iOS picker copy
        run: node scripts/networks-test.mjs
      - name: Favorite actors, and what counts as trending
        run: node scripts/favorite-actors-test.mjs
      - name: Trending is a daily snapshot served from cache
        run: node scripts/trending-cache-test.mjs
      - name: Group recommendations stay pull-only and group-scoped
        run: node scripts/group-suggestions-test.mjs
      - name: Group icons are curated, creator-only, and rename-safe
        run: node scripts/group-icons-test.mjs
      - name: Enrichment honors the member's exact TMDB pick
        run: node scripts/enrich-identity-test.mjs
      - name: Movie enrichment selects on every field it writes
        run: node scripts/enrich-movie-detail-test.mjs

  listimport:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: List import parse and commit
        run: node scripts/import-list-test.mjs

  swift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: swift:5.9
    steps:
      - uses: actions/checkout@v6
      - name: ShowPickerCore tests
        working-directory: ShowPickerCore
        run: swift test
