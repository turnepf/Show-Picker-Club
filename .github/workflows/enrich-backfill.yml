name: Enrich backfill (posters, logos, seasons)

# One-off / on-demand backfill of TMDB enrichment across the whole library —
# posters, network logos, seasons, genres, dates, runtime, cast. /api/enrich
# processes the oldest-enriched shows first (default 50 TV shows per call) and
# stamps enriched_at, so looping rotates through everything. Idempotent and
# cheap once the backlog is clear.
#
# These are FULL passes. `mode: posters` exists for artwork-only catch-up and
# selects rows with no poster at all — on a library whose artwork is already
# complete it has nothing to do and reports 0 forever, which is exactly what
# this workflow used to send.
#
# Auth: sends X-Cron-Secret, which /api/enrich accepts in place of a member
# session. No `member` body → all members.
#
# Required repo secret (must equal the Pages CRON_SECRET):
#   CRON_SECRET — Settings → Secrets and variables → Actions.

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: 'How many batches to run (each ≈ 10 TV + 10 movies)'
        required: false
        default: '40'

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Backfill enrichment
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ROUNDS: ${{ github.event.inputs.rounds || '40' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is not set"
            exit 1
          fi
          URL="https://showpicker.club/api/enrich"
          total=0

          # Prioritise the Trending shelf first — those are the most-visible
          # shows, so populate their posters before the general rotation.
          trending=$(curl -sS "https://showpicker.club/api/popular" \
            | python3 -c "import sys,json; print(json.dumps([s['title'] for s in json.load(sys.stdin).get('shows',[])]))" 2>/dev/null || echo '[]')
          if [ "$trending" != "[]" ] && [ -n "$trending" ]; then
            tresp=$(curl -sS -X POST "$URL" \
              -H "Content-Type: application/json" \
              -H "X-Cron-Secret: ${CRON_SECRET}" \
              -d "{\"titles\":${trending},\"max_tmdb\":6}" \
              -w $'\n%{http_code}')
            thttp=$(printf '%s' "$tresp" | tail -n1)
            tbody=$(printf '%s' "$tresp" | sed '$d')
            tup=$(printf '%s' "$tbody" | python3 -c "import sys,json;print(json.load(sys.stdin).get('tmdbUpdated',0))" 2>/dev/null || echo 0)
            total=$((total + tup))
            echo "trending pass (HTTP $thttp) — tmdbUpdated: $tup"
            sleep 3
          fi

          # Full passes, NOT mode:posters. Posters-only selects rows where
          # poster_url IS NULL and skips the TMDB detail call entirely, so on a
          # library whose artwork is already complete every round reported 0
          # and nothing else — runtime, cast depth, season data — was ever
          # refreshed. The full pass rotates oldest-enriched-first.
          for i in $(seq 1 "$ROUNDS"); do
            resp=$(curl -sS -X POST "$URL" \
              -H "Content-Type: application/json" \
              -H "X-Cron-Secret: ${CRON_SECRET}" \
              -d '{}' \
              -w $'\n%{http_code}')
            http=$(printf '%s' "$resp" | tail -n1)
            body=$(printf '%s' "$resp" | sed '$d')
            if [ "$http" != "200" ]; then
              echo "::error::round $i returned HTTP $http (CRON_SECRET rejected, or endpoint error): $body"
              exit 1
            fi
            # Report what the pass actually saw, not just its success count: a
            # zero with candidates and errors means something is broken, a zero
            # with no candidates means there was nothing to do.
            metrics=$(printf '%s' "$body" | python3 -c "import sys,json;d=json.load(sys.stdin);print('|'.join(str(x) for x in [d.get('tmdbUpdated',0), d.get('tvCandidates',0), d.get('tvErrors',0)+d.get('movieErrors',0), d.get('actorIdsFromCache',0), d.get('lastError') or '-']))" 2>/dev/null || echo "0|0|0|0|-")
            updated=$(printf '%s' "$metrics" | cut -d'|' -f1)
            cands=$(printf '%s' "$metrics" | cut -d'|' -f2)
            errs=$(printf '%s' "$metrics" | cut -d'|' -f3)
            cached=$(printf '%s' "$metrics" | cut -d'|' -f4)
            err=$(printf '%s' "$metrics" | cut -d'|' -f5-)
            total=$((total + updated))
            echo "round $i/$ROUNDS — updated: $updated · candidates: $cands · errors: $errs · actor ids from cache: $cached (running total: $total)"
            if [ "$errs" != "0" ] && [ "$err" != "-" ]; then
              echo "  first error: $err"
            fi
            sleep 3
          done
          echo "Backfill complete. Total TMDB updates: $total"
