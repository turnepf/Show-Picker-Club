name: Enrich backfill (posters, logos, seasons)

# TMDB enrichment across the whole library — posters, network logos, seasons,
# genres, next-episode dates, runtime, cast. /api/enrich processes the
# oldest-enriched shows first and stamps enriched_at, so looping rotates
# through everything.
#
# Runs nightly (07:47 UTC — off the hour, after the 06:17 vibe fill and ahead
# of the 09:37 watch-URL fill, which can use a network this pass names). Until
# 2026-10 this was manual-only, and its only other callers were a web member
# page load and an iOS list import — so once members moved to the apps,
# nothing refreshed next-episode dates and a show that arrived before TMDB had
# artwork sat in Missing posters indefinitely. Don't drop the schedule.
#
# A scheduled run is three steps, cheapest and most visible first:
#   1. `mode: posters` — only rows with no poster. A new show is the
#      most-recently-enriched row in the library, so the oldest-first rotation
#      below would reach it last; this finds it by the missing artwork instead.
#   2. The Trending titles.
#   3. Three `mode: movies` calls — the movie rotation. The full pass below
#      only fetches a film while it's missing something, and its TV half
#      spends the request budget first anyway, so without this a complete
#      film's streaming services and rating never change again.
#   4. A bounded slice of the full rotation (10 rounds x 25 rows). Each row
#      rewrites its cast across every copy, which is the bulk of D1's daily
#      rows-written budget, so the nightly slice is deliberately smaller than
#      a manual drain. Raise `rounds` / `max_tmdb` on a manual run instead.
#
# The full passes are never `mode: posters` — on a library whose artwork is
# complete it has nothing to do and reports 0 forever, and nothing else
# (runtime, cast depth, season data) would ever be refreshed.
#
# Auth: sends X-Cron-Secret, which /api/enrich accepts in place of a member
# session. No `member` body → all members.
#
# Required repo secret (must equal the Pages CRON_SECRET):
#   CRON_SECRET — Settings → Secrets and variables → Actions.

on:
  schedule:
    - cron: '47 7 * * *'
  workflow_dispatch:
    inputs:
      rounds:
        description: 'How many batches to run (nightly run uses 10)'
        required: false
        default: '40'
      max_tmdb:
        description: 'TV rows per round. Blank uses the endpoint default (50); the nightly run uses 25.'
        required: false
        default: ''
      sleep_seconds:
        description: 'Pause between rounds, in seconds.'
        required: false
        default: '3'
      max_retries:
        description: 'Retries per round before giving up on a failing round.'
        required: false
        default: '4'

jobs:
  backfill:
    runs-on: ubuntu-latest
    # Long enough for a deliberately slow pass: many small rounds with a real
    # pause between them takes far longer in wall-clock than a few big ones,
    # even though it asks less of TMDB per minute.
    timeout-minutes: 60
    steps:
      - name: Backfill enrichment
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # A scheduled run has no inputs, so these fallbacks ARE the nightly
          # size; a manual run gets the input defaults declared above.
          ROUNDS: ${{ github.event.inputs.rounds || '10' }}
          MAX_TMDB: ${{ github.event_name == 'schedule' && '25' || github.event.inputs.max_tmdb || '' }}
          SLEEP_SECONDS: ${{ github.event.inputs.sleep_seconds || '3' }}
          MAX_RETRIES: ${{ github.event.inputs.max_retries || '4' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is not set"
            exit 1
          fi
          URL="https://showpicker.club/api/enrich"
          total=0

          # Missing artwork first, found by its absence rather than its age.
          # Small batches (the endpoint's posters default is 6 titles) and at
          # most three of them: a title TMDB has no artwork for yet stays a
          # candidate every night until it does, so "no candidates" is not
          # something this loop can wait for.
          for p in 1 2 3; do
            presp=$(curl -sS --max-time 240 -X POST "$URL" \
              -H "Content-Type: application/json" \
              -H "X-Cron-Secret: ${CRON_SECRET}" \
              -d '{"mode":"posters"}' \
              -w $'\n%{http_code}' || true)
            phttp=$(printf '%s' "$presp" | tail -n1)
            pbody=$(printf '%s' "$presp" | sed '$d')
            if [ "$phttp" = "401" ] || [ "$phttp" = "403" ]; then
              echo "::error::posters pass returned HTTP $phttp — CRON_SECRET is missing or does not match the Pages secret (or Cloudflare challenged the runner): $pbody"
              exit 1
            fi
            if [ "$phttp" != "200" ]; then
              echo "::warning::posters pass $p returned HTTP ${phttp:-none} — moving on to the rotation: $pbody"
              break
            fi
            pm=$(printf '%s' "$pbody" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('tmdbUpdated',0), d.get('tvCandidates',0)+d.get('movieCandidates',0))" 2>/dev/null || echo "0 0")
            pup=${pm%% *}
            pc=${pm##* }
            total=$((total + pup))
            echo "posters pass $p — updated: $pup · candidates: $pc"
            [ "$pc" = "0" ] && break
            sleep 3
          done

          # Prioritise the Trending shelf first — those are the most-visible
          # shows, so populate their posters before the general rotation.
          trending=$(curl -sS "https://showpicker.club/api/popular" \
            | python3 -c "import sys,json; print(json.dumps([s['title'] for s in json.load(sys.stdin).get('shows',[])]))" 2>/dev/null || echo '[]')
          if [ "$trending" != "[]" ] && [ -n "$trending" ]; then
            # `|| true`: the step runs under `bash -e`, where a curl that fails
            # to connect would abort the whole job from inside the command
            # substitution. The status check below is what decides.
            tresp=$(curl -sS --max-time 240 -X POST "$URL" \
              -H "Content-Type: application/json" \
              -H "X-Cron-Secret: ${CRON_SECRET}" \
              -d "{\"titles\":${trending},\"max_tmdb\":6}" \
              -w $'\n%{http_code}' || true)
            thttp=$(printf '%s' "$tresp" | tail -n1)
            tbody=$(printf '%s' "$tresp" | sed '$d')
            tup=$(printf '%s' "$tbody" | python3 -c "import sys,json;print(json.load(sys.stdin).get('tmdbUpdated',0))" 2>/dev/null || echo 0)
            total=$((total + tup))
            echo "trending pass (HTTP $thttp) — tmdbUpdated: $tup"
            sleep 3
          fi

          # The movie rotation, oldest-enriched film first. Each call spends
          # its whole subrequest budget on films (roughly a dozen), so three
          # calls cycle a few hundred films in about a week. Unlike posters
          # mode this always has candidates, so it runs a fixed count.
          for m in 1 2 3; do
            mresp=$(curl -sS --max-time 240 -X POST "$URL" \
              -H "Content-Type: application/json" \
              -H "X-Cron-Secret: ${CRON_SECRET}" \
              -d '{"mode":"movies"}' \
              -w $'\n%{http_code}' || true)
            mhttp=$(printf '%s' "$mresp" | tail -n1)
            mbody=$(printf '%s' "$mresp" | sed '$d')
            if [ "$mhttp" != "200" ]; then
              echo "::warning::movies pass $m returned HTTP ${mhttp:-none} — moving on to the TV rotation: $mbody"
              break
            fi
            mm=$(printf '%s' "$mbody" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('tmdbUpdated',0), d.get('movieCandidates',0), d.get('movieErrors',0))" 2>/dev/null || echo "0 0 0")
            read -r mup mc merr <<< "$mm"
            total=$((total + mup))
            echo "movies pass $m — updated: $mup · candidates: $mc · errors: $merr"
            [ "$mc" = "0" ] && break
            sleep 3
          done

          # Full passes, NOT mode:posters. Posters-only selects rows where
          # poster_url IS NULL and skips the TMDB detail call entirely, so on a
          # library whose artwork is already complete every round reported 0
          # and nothing else — runtime, cast depth, season data — was ever
          # refreshed. The full pass rotates oldest-enriched-first.
          # Body for the full passes. Empty object keeps the endpoint's own
          # default batch size; max_tmdb shrinks it, which is what you want when
          # the goal is to stay well under TMDB's rate limit rather than to
          # finish fast.
          if [ -n "$MAX_TMDB" ]; then
            BODY="{\"max_tmdb\":${MAX_TMDB}}"
          else
            BODY='{}'
          fi
          echo "Running $ROUNDS rounds, body ${BODY}, ${SLEEP_SECONDS}s between rounds."

          stopped_early=''
          for i in $(seq 1 "$ROUNDS"); do
            # A round is retried, not fatal. The endpoint sits behind Cloudflare
            # and a long slow pass is exactly the shape of run that eventually
            # meets an edge blip — a single 503 (`error code: 1102`, the worker
            # hitting its resource ceiling) used to throw away every completed
            # round before it. Each round's work is already committed to D1 and
            # the rotation is oldest-enriched-first, so a retried or even a
            # skipped round costs nothing but time.
            attempt=0
            while :; do
              # `|| true` for the same reason as the trending pass above: under
              # `bash -e` a connection failure inside $(...) exits the job
              # before we can look at the status.
              resp=$(curl -sS --max-time 240 -X POST "$URL" \
                -H "Content-Type: application/json" \
                -H "X-Cron-Secret: ${CRON_SECRET}" \
                -d "$BODY" \
                -w $'\n%{http_code}' || true)
              http=$(printf '%s' "$resp" | tail -n1)
              body=$(printf '%s' "$resp" | sed '$d')
              [ "$http" = "200" ] && break
              # Auth is the one failure retrying cannot fix, and the one worth
              # failing loudly on: the secret is wrong or missing, so every
              # remaining round would fail identically.
              if [ "$http" = "401" ] || [ "$http" = "403" ]; then
                if printf '%s' "$body" | grep -q '_cf_chl_opt\|Just a moment'; then
                  echo "::error::round $i hit a Cloudflare bot challenge — the request never reached the Function. Fix is in the zone's Security settings (dashboard), not the secret."
                else
                  echo "::error::round $i returned HTTP $http — CRON_SECRET is missing or does not match the Pages secret: $body"
                fi
                exit 1
              fi
              attempt=$((attempt + 1))
              [ "$attempt" -gt "$MAX_RETRIES" ] && break
              wait=$((15 * attempt))
              echo "::warning::round $i returned HTTP ${http:-none} (attempt $attempt/$MAX_RETRIES) — retrying in ${wait}s: $body"
              sleep "$wait"
            done

            if [ "$http" != "200" ]; then
              # Out of retries. If the run has already applied updates, the edge
              # is unwell rather than the job misconfigured: keep the work, say
              # so, and let the next run pick the rotation back up.
              if [ "$total" -gt 0 ]; then
                echo "::warning::round $i still failing after $MAX_RETRIES retries (HTTP ${http:-none}): $body"
                stopped_early="round $i (HTTP ${http:-none}) after $MAX_RETRIES retries"
                break
              fi
              echo "::error::round $i returned HTTP ${http:-none} and no round has succeeded this run: $body"
              exit 1
            fi
            # Report what the pass actually saw, not just its success count: a
            # zero with candidates and errors means something is broken, a zero
            # with no candidates means there was nothing to do.
            metrics=$(printf '%s' "$body" | python3 -c "import sys,json;d=json.load(sys.stdin);print('|'.join(str(x) for x in [d.get('tmdbUpdated',0), d.get('tvCandidates',0), d.get('tvErrors',0)+d.get('movieErrors',0), d.get('actorIdsFromCache',0), d.get('lastError') or '-']))" 2>/dev/null || echo "0|0|0|0|-")
            updated=$(printf '%s' "$metrics" | cut -d'|' -f1)
            cands=$(printf '%s' "$metrics" | cut -d'|' -f2)
            errs=$(printf '%s' "$metrics" | cut -d'|' -f3)
            cached=$(printf '%s' "$metrics" | cut -d'|' -f4)
            err=$(printf '%s' "$metrics" | cut -d'|' -f5-)
            total=$((total + updated))
            echo "round $i/$ROUNDS — updated: $updated · candidates: $cands · errors: $errs · actor ids from cache: $cached (running total: $total)"
            if [ "$errs" != "0" ] && [ "$err" != "-" ]; then
              echo "  first error: $err"
            fi
            # Stop early once the rotation reports nothing left to do, rather
            # than burning the remaining rounds on empty passes.
            if [ "$cands" = "0" ]; then
              echo "No candidates left — stopping after round $i."
              break
            fi
            sleep "$SLEEP_SECONDS"
          done
          if [ -n "$stopped_early" ]; then
            echo "Backfill stopped early at $stopped_early. Total TMDB updates: $total (all applied — re-run to continue the rotation)."
          else
            echo "Backfill complete. Total TMDB updates: $total"
          fi
