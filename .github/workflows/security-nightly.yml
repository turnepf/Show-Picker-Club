name: Nightly security + smoke

# Runs the live assertion suite against production every night and opens a
# GitHub issue when something fails. Deploys already run scripts/smoke.sh, but
# that only covers the moment of deploy — this catches drift that arrives
# without one: an expired secret, a Cloudflare-side rule change, a D1 migration
# applied out of band, a dependency of the public surface changing shape.
#
# Deliberately opens an issue rather than emailing: a failure here is work, and
# work belongs somewhere it can be closed.

on:
  schedule:
    # 09:20 UTC daily. Off the hour so it isn't queued behind everyone else's
    # :00 cron, and after the 05:43 backup so a bad night is already captured.
    - cron: '20 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Live smoke + security assertions
        id: smoke
        run: |
          set +e
          bash scripts/smoke.sh https://showpicker.club 2>&1 | tee smoke.log
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Certificate expiry
        id: cert
        run: |
          set +e
          end=$(echo | openssl s_client -servername showpicker.club \
                -connect showpicker.club:443 2>/dev/null \
                | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)
          if [ -z "$end" ]; then
            echo "Could not read the certificate." | tee -a smoke.log
            echo "status=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          days=$(( ( $(date -d "$end" +%s) - $(date +%s) ) / 86400 ))
          echo "Certificate expires in $days days ($end)" | tee -a smoke.log
          # Cloudflare renews these automatically, so a short fuse means
          # automation has stopped rather than that a renewal is merely due.
          if [ "$days" -lt 10 ]; then
            echo "::error::certificate expires in $days days"
            echo "status=1" >> "$GITHUB_OUTPUT"
          else
            echo "status=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Open an issue on failure
        if: steps.smoke.outputs.status != '0' || steps.cert.outputs.status != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          log = open("smoke.log").read()[-8000:]
          body = (
              "The nightly smoke and security run failed against "
              "`https://showpicker.club`.\n\n"
              f"[Run log]({os.environ['RUN_URL']})\n\n"
              "Failing assertions are the `::error::` lines below. What they mean "
              "is documented in `docs/INVARIANTS.md`.\n\n"
              "```\n" + log + "\n```\n\n"
              "---\n_Generated by [Claude Code](https://claude.ai/code)_\n"
          )
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/issues",
              data=json.dumps({
                  "title": "Nightly smoke failed against production",
                  "body": body,
              }).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(req, timeout=60) as r:
              print("opened issue", json.load(r).get("number"))
          PY

      - name: Fail the run
        if: steps.smoke.outputs.status != '0' || steps.cert.outputs.status != '0'
        run: exit 1
