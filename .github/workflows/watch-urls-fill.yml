name: Background streaming deep-link fill

# Two passes over the same problem — rows with no usable streaming link —
# cheapest first.
#
# 1. Adopt networks from club copies (/api/admin-url-cleanup,
#    action: inherit_networks). A row with no network at all can't be reached
#    by URL propagation, which is scoped by (title, network). Where every
#    other active copy of the title agrees on a service, the answer is
#    unambiguous, so the row adopts it and then picks up its siblings' URLs.
#    Titles whose copies disagree are skipped — that conflict is a human call
#    and stays on the Show Cleanup page. Free: D1 only, no third party.
# 2. Drain shows that still lack a real deep link via
#    /api/admin-fill-watch-urls (Watchmode).
#
# Order matters: step 1 is what makes a row eligible for step 2, so a title
# rescued tonight can get its link tonight rather than tomorrow.
#
# Both endpoints are idempotent — the fill only touches rows whose network_url
# is missing or a placeholder/search page, and the adopt only touches rows
# with no network — so once the backlog clears these runs find nothing and
# cost ~0.
#
# Budget: Watchmode's free tier is ~1000 requests/month and each candidate
# costs ~2 calls (search + sources). We run once a day with a small cap
# (default 15 titles ≈ 30 calls/day ≈ 900/month), leaving headroom for the
# real-time insert/edit lookups and ad-hoc operator runs. Watchmode's faster
# endpoints + higher request-volume infra (mid-2026 updates) mean a single
# "Run workflow" drain can now go up to 250 titles without timing out — but
# the ~1000/month quota is still the real ceiling, so keep the monthly total
# under it when bumping `limit`.
#
# Required repo secret (must equal the Pages CRON_SECRET):
#   CRON_SECRET — Settings → Secrets and variables → Actions.

on:
  schedule:
    - cron: '37 9 * * *'   # daily at 09:37 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max titles to process this run (~2 Watchmode calls each)'
        required: false
        default: '15'
      mode:
        description: "standard (missing links) or amazon-shape (one-time: Prime rows on a host tvOS can't open)"
        required: false
        default: 'standard'
        type: choice
        options:
          - standard
          - amazon-shape

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Free and fast, and it feeds the Watchmode step below. A failure here
      # is reported but doesn't stop the fill: the two passes are independent,
      # and losing the cheap one is no reason to skip the one on a quota.
      - name: Adopt networks from club copies
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is not set"
            exit 1
          fi
          resp=$(curl -sS --max-time 120 -X POST "https://showpicker.club/api/admin-url-cleanup" \
            -H "Content-Type: application/json" \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            -d '{"action": "inherit_networks"}' \
            -w $'\n%{http_code}' || true)
          http=$(printf '%s' "$resp" | tail -n1)
          body=$(printf '%s' "$resp" | sed '$d')
          echo "HTTP $http: $body"
          if [ "$http" != "200" ]; then
            if printf '%s' "$body" | grep -q '_cf_chl_opt\|Just a moment'; then
              echo "::error::Cloudflare served a bot challenge to the GitHub runner — the request never reached the Function. Fix is in the zone's Security settings (dashboard), not the secret."
            else
              echo "::error::adopt networks returned HTTP $http (CRON_SECRET rejected, or endpoint error)"
            fi
            exit 1
          fi
          set_count=$(printf '%s' "$body" | python3 -c "import sys,json;print(json.load(sys.stdin).get('networks_set',0))" 2>/dev/null || echo 0)
          url_count=$(printf '%s' "$body" | python3 -c "import sys,json;print(json.load(sys.stdin).get('urls_filled',0))" 2>/dev/null || echo 0)
          echo "Done. Networks adopted: $set_count · URLs filled: $url_count"

      - name: Fill streaming deep links
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          LIMIT: ${{ github.event.inputs.limit || '15' }}
          MODE: ${{ github.event.inputs.mode || 'standard' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is not set"
            exit 1
          fi
          URL="https://showpicker.club/api/admin-fill-watch-urls"
          resp=$(curl -sS -X POST "$URL" \
            -H "Content-Type: application/json" \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            -d "{\"limit\": ${LIMIT}, \"mode\": \"${MODE}\"}" \
            -w $'\n%{http_code}')
          http=$(printf '%s' "$resp" | tail -n1)
          body=$(printf '%s' "$resp" | sed '$d')
          echo "HTTP $http: $body"
          if [ "$http" != "200" ]; then
            if printf '%s' "$body" | grep -q '_cf_chl_opt\|Just a moment'; then
              echo "::error::Cloudflare served a bot challenge to the GitHub runner — the request never reached the Function. Fix is in the zone's Security settings (dashboard), not the secret."
            else
              echo "::error::watch-url fill returned HTTP $http (CRON_SECRET rejected, or endpoint error)"
            fi
            exit 1
          fi
          if printf '%s' "$body" | grep -q '"error"'; then
            echo "::error::watch-url fill returned an error body"
            exit 1
          fi
          checked=$(printf '%s' "$body" | python3 -c "import sys,json;print(json.load(sys.stdin).get('checked',0))" 2>/dev/null || echo 0)
          filled=$(printf '%s' "$body" | python3 -c "import sys,json;print(json.load(sys.stdin).get('filled',0))" 2>/dev/null || echo 0)
          echo "Done. Checked: $checked · Filled: $filled"
