<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibe — Show Picker Club</title>
  <!-- Native Smart App Banner: iPhone/iPad Safari's one prompt for the app
       (OPEN when installed, GET when not). app-banner.js bows out there. -->
  <meta name="apple-itunes-app" content="app-id=6780282764">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfaf8">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#292522">
  <link rel="stylesheet" href="/styles.css?v=7">
  <style>
    /* The native app's tint, so chrome and actions match iOS. */
    :root { --tint: #6D63EB; }
    @media (prefers-color-scheme: dark) { :root { --tint: #8D87F5; } }
    body { padding: 24px 16px 60px; }
    .wrap { max-width: 720px; margin: 0 auto; }
    .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .topbar a.back { color: var(--tint); text-decoration: none; font-size: 16px; padding: 4px 4px 4px 0; white-space: nowrap; }
    .topbar h1 { font-family: var(--font-sans); font-size: 17px; font-weight: 600; color: var(--ink); flex: 0 0 auto; }
    .topbar select {
      flex: 1; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px;
      font-size: 15px; background: var(--surface); font-family: inherit;
    }

    .hero {
      background: var(--surface); border-radius: 12px; padding: 32px 24px; text-align: center;
      box-shadow: var(--shadow-card); margin-bottom: 20px;
    }
    .hero .star { color: var(--tint); font-size: 14px; letter-spacing: 2px; }
    .hero .cluster-name { font-family: var(--font-sans); font-size: var(--text-xl); color: var(--ink); margin: 8px 0 12px; font-weight: 700; letter-spacing: -0.015em; }
    .hero .cluster-tag { color: var(--ink-muted); font-size: 15px; line-height: 1.5; max-width: 540px; margin: 0 auto; font-style: italic; }
    .hero .similarity { color: var(--ink-quiet); font-size: 12px; margin-top: 14px; }

    .section { background: var(--surface); border-radius: 10px; padding: 20px 24px; margin-bottom: 16px; border: 1px solid var(--border-soft); }
    .section h2 { font-family: var(--font-sans); font-size: 16px; color: var(--ink); margin-bottom: 14px; font-weight: 600; }

    .trait-block { margin-bottom: 10px; }
    .trait-row { display: flex; align-items: center; gap: 12px; font-size: 14px; }
    .trait-row .lbl { flex: 0 0 38%; color: var(--ink); }
    .trait-row .bar-bg { flex: 1; height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
    .trait-row .bar { height: 100%; background: var(--tint); border-radius: 5px; transition: width 0.6s ease-out; }
    .trait-row .val { flex: 0 0 42px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink); }
    .trait-explain { font-size: 11px; color: var(--ink-quiet); margin: 2px 0 0 calc(38% + 12px); line-height: 1.35; }
    @media (max-width: 480px) {
      .trait-row .lbl { flex: 0 0 44%; font-size: 13px; }
      .trait-explain { margin-left: 0; }
    }

    .toggle-more { display: block; text-align: center; padding: 10px 0 0; background: none; border: none; color: var(--tint); font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .blend-note { font-size: 12px; color: var(--ink-muted); margin-bottom: 12px; font-style: italic; }

    .balance-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
    .balance-item .lbl { font-size: 13px; color: var(--ink-muted); margin-bottom: 4px; }
    .balance-item .val-row { display: flex; align-items: center; gap: 10px; }
    .balance-item .pill {
      display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px;
      background: var(--surface-2); color: var(--ink); font-weight: 600;
    }
    .balance-item .pill.dark { background: var(--ink); color: #fff; }
    .balance-item .pill.warm { background: var(--accent-soft); color: var(--tab-up-next); }

    /* The one thing a vibe pick adds to a standard show card: a "+" that
       opens the add-to-my-list modal. */
    .pick-add {
      flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%;
      background: var(--tint); color: #fff; border: none; font-size: 16px; line-height: 1;
      cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center;
    }
    .pick-add:hover { filter: brightness(0.92); }
    .pick-empty { padding: 14px 16px; font-size: 13px; color: var(--ink-faint); }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 100; padding: 16px;
    }
    .modal-overlay.hidden { display: none; }
    .modal-card {
      background: var(--surface); padding: 24px; border-radius: 12px;
      max-width: 420px; width: 100%; max-height: calc(100vh - 32px); overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .modal-card h2 { font-family: var(--font-sans); font-size: 17px; text-align: center; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
    .modal-pick-info {
      background: var(--surface-2); padding: 10px 12px; border-radius: 6px;
      font-size: 13px; margin: 12px 0;
    }
    .modal-pick-info .modal-pick-title { font-weight: 600; color: var(--ink); font-size: 14px; }
    .modal-pick-info .modal-pick-meta { color: var(--ink-muted); margin-top: 2px; }
    .modal-card label { display: block; font-size: 13px; font-weight: 500; margin: 12px 0 6px; color: var(--ink-muted); }
    .modal-card select, .modal-card textarea {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px;
      font-size: 14px; font-family: inherit;
    }
    .modal-card select:focus, .modal-card textarea:focus { outline: none; border-color: var(--accent); box-shadow: var(--focus-ring); }
    .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
    .modal-actions button {
      flex: 1; padding: 10px; border-radius: 6px; font-size: 14px; font-weight: 600;
      cursor: pointer; font-family: inherit; border: none;
    }
    .modal-actions .cancel { background: var(--surface-2); color: var(--ink); }
    .modal-actions .submit { background: var(--accent); color: var(--ink); font-weight: 700; }
    .modal-actions .submit:hover { background: var(--accent-hover); }
    .modal-actions button:disabled { opacity: 0.5; cursor: not-allowed; }
    #addError:empty { display: none; }
    #addError { margin-top: 10px; padding: 8px 10px; background: var(--danger-soft); color: var(--danger-deep); border-radius: 6px; font-size: 12px; }

    .footer { text-align: center; color: var(--ink-quiet); font-size: 12px; margin-top: 24px; }
    .empty-card { background: var(--surface); border-radius: 10px; padding: 32px; text-align: center; color: var(--ink-muted); font-size: 14px; }
    .err { color: var(--danger-deep); font-size: 13px; text-align: center; padding: 20px; }

    @media (prefers-reduced-motion: reduce) {
      .trait-row .bar { transition: none; }
    }
  </style>
  <!-- iOS skin: layered last to refine the page into the native grouped-card
       look (recessed bg, soft rounded cards, sticky nav-bar). -->
  <style id="ios-skin">
    body { background: var(--surface-2); }
    .topbar {
      position: sticky; top: 0; z-index: 10;
      margin: -24px -16px 22px; padding: 10px 16px;
      background: color-mix(in srgb, var(--surface-2) 86%, transparent);
      backdrop-filter: saturate(180%) blur(12px);
      -webkit-backdrop-filter: saturate(180%) blur(12px);
      border-bottom: 1px solid var(--border-soft);
    }
    .section { border: none; border-radius: 14px; box-shadow: var(--shadow-card); }
    .hero, .modal-card { border-radius: 16px; }
    .topbar select { border-radius: 9px; }
  </style>
  <script src="/show-renderer.js?v=3"></script>
  <script src="/shell.js?v=5" defer></script>
  <script src="/app-banner.js?v=4" defer></script>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a class="back" href="/" title="Home">&#8249; Home</a>
      <h1>Vibe</h1>
      <select id="memberSelect" aria-label="Pick a member"></select>
    </div>
    <div id="content"><div class="empty-card">Loading&hellip;</div></div>
    <div class="footer" id="footer"></div>
  </div>

  <div class="modal-overlay hidden" id="addOverlay" onclick="closeAddModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <h2>Add to my list</h2>
      <div class="modal-pick-info">
        <div class="modal-pick-title" id="addTitle"></div>
        <div class="modal-pick-meta" id="addMeta"></div>
      </div>
      <label for="addList">Which list?</label>
      <select id="addList">
        <option value="next">Next Up</option>
        <option value="watching">Watching</option>
        <option value="waiting">Waiting</option>
        <option value="recommending">Loved</option>
      </select>
      <label for="addNotes">Notes (optional)</label>
      <textarea id="addNotes" rows="2" placeholder="e.g. Started season 2 already"></textarea>
      <div class="modal-actions">
        <button type="button" class="cancel" onclick="closeAddModal()">Cancel</button>
        <button type="button" class="submit" id="addSubmitBtn" onclick="submitAdd()">Add</button>
      </div>
      <div id="addError"></div>
    </div>
  </div>

  <script>
    // escapeHtml() and safeUrl() come from show-renderer.js — one copy.

    const TOP_TRAITS = ['Complexity', 'Warmth', 'Curiosity', 'Empathy'];

    // Plain-English explanations for each display trait. Higher = more of it.
    const TRAIT_EXPLAIN = {
      'Warmth': 'How much affection, found-family, and comfort your shows lean into.',
      'Empathy': 'How much your taste rewards understanding other people’s inner lives.',
      'Complexity': 'Moral ambiguity, dense plotting, and prestige-drama feel.',
      'Cynicism risk': 'Distrustful, mean-humored, or nihilistic energy.',
      'Power orientation': 'Interest in hierarchies, status games, manipulation.',
      'Curiosity': 'Ideas, puzzles, intellectual depth, learning.',
      'Healing & growth': 'Characters working through wounds and finding redemption.',
      'Chaos tolerance': 'Comfort with unpredictable, anarchic, big-swing storytelling.',
      'Humor (warm vs cruel)': '0 = humor at others’ expense, 100 = humor that’s kind.',
      'Optimism': 'Hopeful, life-affirming worldview vs. bleak.',
    };

    const BLEND_EXPLAIN = {
      'Curious Omnivore': 'Watches broadly across prestige, comedy, and comfort.',
      'Warm Comfort Viewer': 'Found-family, soft-blanket shows; low on darkness.',
      'Prestige Drama Loyalist': 'Slow burns, ambitious craft, morally ambiguous leads.',
      'Dark Complexity Seeker': 'Heavy themes with empathy underneath, not nihilism.',
      'Satirical Cynic': 'Sharp irony at the expense of the powerful.',
      'Power Game Watcher': 'Status, scheming, who-controls-whom.',
      'Chaos Goblin': 'Unhinged, absurd, emotionally chaotic. Big swings.',
      'Empathy & Healing Viewer': 'Emotional repair, redemption, chosen family.',
    };

    let authMember = null;     // slug of the logged-in viewer (or null)
    let pageMember = null;     // slug of the member whose vibe we're viewing
    let currentPicks = [];     // both aligned + outlier; indexed by data-pick-key

    // Picks render with the shared show card (show-renderer.js), same as
    // every other list in the app. Genre and cast used to expand inline here;
    // they live on the show's detail screen, which the card now opens — one
    // detail card everywhere instead of a second, thinner one on this page.
    function renderPickRow(p, key, opts) {
      const captionParts = [];
      if (p.network) captionParts.push(escapeHtml(p.network));
      if (p.list) captionParts.push(escapeHtml(p.list === 'next' ? 'Next Up' : p.list));
      const addBtn = opts.canAdd
        ? `<button class="pick-add" data-pick-key="${key}" title="Add to my list" aria-label="Add to my list">+</button>`
        : '';
      return renderShowCard(p, {
        onClickId: p.id ? true : null,
        showRating: true,
        showChevron: !!p.id,
        caption: captionParts.join(' · '),
        prefixHtml: addBtn,
      });
    }

    function renderMember(m) {
      if (m.excluded) {
        return `<div class="empty-card">${escapeHtml(m.name)}'s list isn't used for taste-based features.</div>`;
      }
      if (m.is_seed_only) {
        return `<div class="empty-card">${escapeHtml(m.name)} hasn't engaged with their list yet, so there's no fingerprint to compute.</div>`;
      }
      if (m.no_fingerprint) {
        return `<div class="empty-card">No scored shows on ${escapeHtml(m.name)}'s list yet. Once trait data fills in, a fingerprint will appear here.</div>`;
      }

      const c = m.cluster;
      const traits = m.display_traits;
      const traitOrder = Object.keys(traits);
      const top = TOP_TRAITS.filter(t => t in traits);
      const rest = traitOrder.filter(t => !top.includes(t));

      const traitBars = (names) => names.map(name => `
        <div class="trait-block">
          <div class="trait-row">
            <span class="lbl">${escapeHtml(name)}</span>
            <div class="bar-bg"><div class="bar" style="width:${traits[name]}%;"></div></div>
            <span class="val">${traits[name]}</span>
          </div>
          ${TRAIT_EXPLAIN[name] ? `<div class="trait-explain">${escapeHtml(TRAIT_EXPLAIN[name])}</div>` : ''}
        </div>
      `).join('');

      const b = m.balance;
      const wdPillClass = b.warmth_darkness_label === 'Tilted dark' ? 'dark'
        : b.warmth_darkness_label === 'Warmth-leaning' ? 'warm'
        : '';

      const isOwnPage = !!authMember && authMember === m.slug;

      // Track picks globally so the modal can pull data by key.
      currentPicks = [];
      const pickKey = (idx, kind) => `${kind}-${idx}`;

      const aligned = (m.aligned_picks || []).map((p, i) => {
        const key = pickKey(i, 'aligned');
        currentPicks.push({ key, data: p });
        return renderPickRow(p, key, { canAdd: isOwnPage });
      }).join('') || '<div class="pick-empty">No aligned picks available.</div>';

      const outliers = (m.outlier_picks || []).map((p, i) => {
        const key = pickKey(i, 'outlier');
        currentPicks.push({ key, data: p });
        return renderPickRow(p, key, { canAdd: false });
      }).join('') || '<div class="pick-empty">Not enough scored shows to find outliers.</div>';

      const blendRows = (c.blend || []).map(b => {
        const pct = Math.max(0, Math.round(b.similarity * 100));
        return `<div class="trait-block">
          <div class="trait-row">
            <span class="lbl">${escapeHtml(b.name)}</span>
            <div class="bar-bg"><div class="bar" style="width:${pct}%;"></div></div>
            <span class="val">${pct}%</span>
          </div>
          ${BLEND_EXPLAIN[b.name] ? `<div class="trait-explain">${escapeHtml(BLEND_EXPLAIN[b.name])}</div>` : ''}
        </div>`;
      }).join('');

      return `
        <div class="hero">
          <div class="star">&#9733; &#9733; &#9733;</div>
          <div class="cluster-name">${escapeHtml(c.name)}</div>
          <div class="cluster-tag">"${escapeHtml(c.tagline)}"</div>
          <div class="similarity">Primary cluster &middot; ${c.similarity ? Math.round(c.similarity * 100) : 0}% match</div>
        </div>

        <div class="section">
          <h2>Your blend</h2>
          <p class="blend-note">Taste isn't single-axis. Here are the three clusters that best fit your fingerprint:</p>
          ${blendRows}
        </div>

        <div class="section">
          <h2>Top signals</h2>
          ${traitBars(top)}
        </div>

        <div class="section">
          <h2>Full profile</h2>
          <div id="restTraits" style="display:none;">${traitBars(rest)}</div>
          <button class="toggle-more" id="toggleMore" type="button">Show all traits &#9660;</button>
        </div>

        <div class="section">
          <h2>Balance read</h2>
          <div class="balance-grid">
            <div class="balance-item">
              <div class="lbl">Warmth vs darkness</div>
              <div class="val-row"><span class="pill ${wdPillClass}">${escapeHtml(b.warmth_darkness_label)}</span></div>
              <div class="trait-explain" style="margin-left:0;">Whether your taste tilts warm, dark, or stays balanced.</div>
            </div>
            <div class="balance-item">
              <div class="lbl">Range across genres</div>
              <div class="val-row">
                <div class="bar-bg" style="flex:1;"><div class="bar" style="width:${b.range}%;"></div></div>
                <span class="val">${b.range}</span>
              </div>
              <div class="trait-explain" style="margin-left:0;">How varied your trait fingerprint is. Higher means a wider range of moods and styles.</div>
            </div>
          </div>
        </div>

        <div class="section">
          <h2>Shows aligned with your vibe</h2>
          <p class="blend-note">Trait-similarity picks from across the club, closest in mood to your fingerprint.</p>
          <div class="show-list">${aligned}</div>
        </div>

        <div class="section">
          <h2>Shows that don't make sense</h2>
          <p class="blend-note">Shows already on this list whose trait pattern is the opposite of the fingerprint: outliers in the member's own taste.</p>
          <div class="show-list">${outliers}</div>
        </div>
      `;
    }

    function bindPickInteractions() {
      document.querySelectorAll('.pick-add').forEach(btn => {
        btn.addEventListener('click', (e) => {
          // The button sits inside the card, which is itself a link to the
          // detail screen — don't navigate out from under the modal.
          e.stopPropagation();
          openAddModal(btn.dataset.pickKey);
        });
      });
    }

    // Show cards open the detail screen on the member page whose vibe is
    // showing, so a pick lands on the same card as everywhere else.
    window.__showRendererClickHandler = (showId) => {
      const slug = pageMember || authMember;
      if (!slug || !showId) return;
      location.href = `/${encodeURIComponent(slug)}?show=${encodeURIComponent(showId)}`;
    };

    function openAddModal(key) {
      const entry = currentPicks.find(p => p.key === key);
      if (!entry) return;
      const p = entry.data;
      document.getElementById('addTitle').textContent = p.title;
      const meta = [];
      if (p.network) meta.push(p.network);
      if (p.rating) meta.push(`★ ${p.rating}`);
      if (p.genres) meta.push(p.genres);
      document.getElementById('addMeta').textContent = meta.join(' · ');
      document.getElementById('addList').value = 'next';
      document.getElementById('addNotes').value = '';
      document.getElementById('addError').textContent = '';
      document.getElementById('addSubmitBtn').disabled = false;
      document.getElementById('addSubmitBtn').dataset.pickKey = key;
      document.getElementById('addOverlay').classList.remove('hidden');
    }

    function closeAddModal(event) {
      if (event && event.target !== event.currentTarget) return;
      document.getElementById('addOverlay').classList.add('hidden');
    }

    async function submitAdd() {
      const btn = document.getElementById('addSubmitBtn');
      const errBox = document.getElementById('addError');
      const key = btn.dataset.pickKey;
      const entry = currentPicks.find(p => p.key === key);
      if (!entry) { closeAddModal(); return; }
      const p = entry.data;
      const list = document.getElementById('addList').value;
      const notes = document.getElementById('addNotes').value.trim();
      btn.disabled = true;
      errBox.textContent = '';
      try {
        const res = await fetch('/api/shows', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title: p.title,
            network: p.network || null,
            network_url: p.network_url || null,
            list,
            notes: notes || null,
            // The pick's TMDB entry, so a show that shares its title isn't
            // added in its place.
            ...(p.tmdb_id ? { tmdb_id: p.tmdb_id, tmdb_type: p.tmdb_type, movie: p.tmdb_type === 'movie' ? 1 : 0 } : {}),
          }),
        });
        if (!res.ok) {
          // Translate server codes; never show a raw one like "rate_limited".
          let msg = res.status === 401
            ? 'You’re logged out — refresh the page and log in again.'
            : `Error (${res.status})`;
          try {
            const data = await res.json();
            if (data.error === 'exists_archived') msg = 'You archived this once already. Unarchive from your list.';
            else if (data.error === 'exists_active') msg = `Already on your ${data.list} list.`;
            else if (data.error === 'rate_limited') msg = 'Daily add limit reached. Try again tomorrow.';
          } catch {}
          errBox.textContent = msg;
          btn.disabled = false;
          return;
        }
        // Success — remove the row from the page and close.
        document.querySelectorAll(`[data-pick-key="${key}"]`).forEach(el => {
          const row = el.closest('.pick-row');
          if (row) row.remove();
        });
        closeAddModal();
      } catch (e) {
        errBox.textContent = 'Network error. Try again.';
        btn.disabled = false;
      }
    }

    function bindToggle() {
      const btn = document.getElementById('toggleMore');
      const rest = document.getElementById('restTraits');
      if (!btn || !rest) return;
      btn.addEventListener('click', () => {
        const open = rest.style.display === 'block';
        rest.style.display = open ? 'none' : 'block';
        btn.innerHTML = open ? 'Show all traits &#9660;' : 'Hide &#9650;';
      });
    }

    function setUrlMember(slug) {
      const u = new URL(window.location.href);
      u.searchParams.set('member', slug);
      window.history.replaceState(null, '', u.toString());
    }

    async function load(slug) {
      const content = document.getElementById('content');
      const footer = document.getElementById('footer');
      content.innerHTML = '<div class="empty-card">Loading&hellip;</div>';
      footer.textContent = '';

      try {
        const url = slug ? `/api/vibe?member=${encodeURIComponent(slug)}` : '/api/vibe';
        const res = await fetch(url);
        if (res.status === 401) {
          content.innerHTML = '<div class="empty-card">Vibe profiles are only visible to logged-in members. Visit your member page and tap <strong>Edit</strong> to log in, then come back.</div>';
          document.getElementById('memberSelect').innerHTML = '';
          return;
        }
        const data = await res.json();

        const sel = document.getElementById('memberSelect');
        if (sel.options.length === 0 && data.members) {
          sel.innerHTML = data.members.map(m => `<option value="${escapeHtml(m.slug)}">${escapeHtml(m.name)}</option>`).join('');
        }
        if (data.member && data.member.slug) {
          sel.value = data.member.slug;
        }

        if (!data.member) {
          content.innerHTML = '<div class="empty-card">Pick a member from the dropdown.</div>';
          return;
        }

        pageMember = data.member.slug || null;
        content.innerHTML = renderMember(data.member);
        bindToggle();
        bindPickInteractions();

        if (data.member.scored_count != null && data.member.active_count != null) {
          footer.textContent = `Computed from ${data.member.scored_count} of ${data.member.active_count} active shows.`;
        }
      } catch (e) {
        content.innerHTML = `<div class="err">Failed to load: ${escapeHtml(e.message || e)}</div>`;
      }
    }

    document.getElementById('memberSelect').addEventListener('change', (e) => {
      setUrlMember(e.target.value);
      load(e.target.value);
    });

    // On first load: identify the viewer (so the +Add button can decide whether
    // to render), then pick a default member to display.
    (async () => {
      try {
        const r = await fetch('/auth/check', {
          headers: { 'X-Client-Platform': window.innerWidth < 768 ? 'web-small' : 'web-large' },
        });
        if (r.ok) {
          const d = await r.json();
          if (d.authenticated && d.member) authMember = d.member;
        }
      } catch {}

      const params = new URLSearchParams(window.location.search);
      let slug = params.get('member') || authMember || 'patrick';
      load(slug);
    })();
  </script>
</body>
</html>
