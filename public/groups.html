<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Groups — Show Picker Club</title>
  <meta name="apple-itunes-app" content="app-id=6780282764">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfaf8">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#292522">
  <link rel="stylesheet" href="/styles.css?v=6">
  <style>
    :root { --tint: #6D63EB; }
    @media (prefers-color-scheme: dark) { :root { --tint: #8D87F5; } }
    body { padding-top: 0; }
    header {
      background: color-mix(in srgb, var(--surface-2) 86%, transparent);
      -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
      color: var(--ink);
      border-bottom: 1px solid var(--border-soft);
      padding: 12px 20px;
      padding-top: calc(12px + env(safe-area-inset-top, 0px));
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-top {
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 720px;
      margin: 0 auto;
      position: relative;
    }
    .header-top a.back {
      color: var(--tint);
      text-decoration: none;
      font-size: 16px;
      line-height: 1;
      padding: 6px 10px 6px 0;
      position: relative; z-index: 1;
      /* Comfortable touch target; the label is set by updateNav(), so the
         chevron comes from CSS to survive a textContent-only update. */
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      max-width: 45%;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .header-top a.back::before { content: '\2039'; margin-right: 5px; font-size: 20px; }
    @media (min-width: 1024px) {
      /* The shell sidebar owns Home at this width, so a back that would only
         leave the page is redundant — but one that pops an in-page view
         (group → member → show) is the sole way back up the stack. */
      .header-top a.back:not(.is-in-page) { display: none !important; }
    }
    .header-top h1 {
      font-family: var(--font-sans);
      font-size: 17px;
      font-weight: 600;
      position: absolute;
      left: 50%; transform: translateX(-50%);
      white-space: nowrap;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }
    /* Inset-grouped list vocabulary, matching the sidebar nav (shell.js) and
       the main app's own nav, so the groups list and a group's member list
       read as the same control. Scoped to main: the shell's own .shell-side
       rules stay untouched. */
    main .ios-group {
      background: var(--surface);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 22px;
      box-shadow: 0 1px 3px oklch(0.18 0.03 50 / 0.06);
    }
    main .ios-group-header {
      font-size: 13px; font-weight: 400;
      text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--ink-quiet);
      padding: 0 16px 7px; margin: 2px 0 0;
    }
    main .ios-item {
      position: relative;
      display: flex; align-items: center; gap: 12px;
      width: 100%; min-height: 44px;
      padding: 10px 14px;
      background: none; border: none;
      font-family: var(--font-sans); font-size: 16px; line-height: 1.3; text-align: left;
      color: var(--ink); text-decoration: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    main .ios-item:active { background: var(--surface-2); }
    main .ios-item + .ios-item::after {
      content: ""; position: absolute; left: 48px; right: 0; top: 0;
      height: 1px; background: var(--border-soft);
    }
    main .ios-item.no-icon + .ios-item.no-icon::after { left: 14px; }
    main .ios-item-label { flex: 1; min-width: 0; }
    main .ios-item-detail { color: var(--ink-quiet); font-size: 13px; white-space: nowrap; }
    main .ios-item-chev { width: 15px; height: 15px; flex: 0 0 auto; color: var(--ink-faint); }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.3);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface);
      border-radius: 12px;
      padding: 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .modal h2 { margin: 0 0 16px; font-size: 18px; font-weight: 600; }
    .modal input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-soft);
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
      box-sizing: border-box;
    }
    .modal input:focus { outline: none; border-color: var(--tint); }
    .modal-buttons { display: flex; gap: 8px; }
    .modal-buttons button { flex: 1; padding: 10px; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; }
    .modal-buttons .btn-cancel { background: var(--surface-2); color: var(--ink); }
    .modal-buttons .btn-submit { background: var(--tint); color: white; }

    .invite-link-input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--border-soft);
      border-radius: 6px;
      font-size: 12px;
      background: var(--surface);
      color: var(--ink);
      font-family: monospace;
    }
    .invite-link-btn {
      padding: 8px 12px;
      background: var(--tint);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }
    .invite-link-btn:hover { opacity: 0.9; }

    .join-section {
      text-align: center;
      padding: 40px 20px;
    }
    .join-section h2 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
    .join-section p { color: var(--ink-muted); font-size: 14px; margin: 0 0 20px; }
    .join-input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .join-input-row input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid var(--border-soft);
      border-radius: 8px;
      font-size: 14px;
    }
    .join-input-row button {
      padding: 10px 20px;
      background: var(--tint);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--ink-muted);
    }
    .empty-state h3 { font-size: 16px; margin: 0 0 8px; }
    .empty-state p { font-size: 13px; margin: 0; }

    .list-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-soft);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .list-tab {
      padding: 12px 16px;
      border: none;
      background: none;
      font-size: 15px;
      font-weight: 500;
      color: var(--ink-muted);
      cursor: pointer;
      white-space: nowrap;
      border-bottom: 3px solid transparent;
      position: relative;
      bottom: -1px;
    }
    .list-tab.active {
      color: var(--ink);
      border-bottom-color: var(--tint);
    }

    #groupsList { display: none; }
    #groupView { display: none; }
    #memberView { display: none; }
    #showDetail { display: none; }
    #joinFlow { display: none; }

    body { background: var(--surface-2); }

    /* Group icons (migration 066). The server stores SF Symbol names; a
       browser can't draw those, so each maps to an emoji on the same tinted
       disc the apps use. */
    .group-badge {
      display: inline-flex; align-items: center; justify-content: center;
      flex: 0 0 auto; border-radius: 50%;
      background: var(--gb, #8E8E93); color: white; line-height: 1;
    }
    .icon-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 12px 0; }
    .icon-grid button {
      min-height: 44px; border: none; border-radius: 10px; cursor: pointer;
      background: var(--surface-2); font-size: 20px;
    }
    .icon-grid button.selected { background: var(--gb, #8E8E93); outline: 2px solid var(--ink); }
    .swatches { display: flex; flex-wrap: wrap; gap: 10px; margin: 4px 0 16px; }
    .swatches button {
      width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
      border: 2px solid transparent; background: var(--sw); padding: 0;
    }
    .swatches button.none { background: none; border-color: var(--ink-quiet); color: var(--ink-quiet); font-size: 14px; }
    .swatches button.selected { outline: 2px solid var(--ink); outline-offset: 2px; }
    .change-notice {
      display: flex; gap: 10px; align-items: flex-start;
      background: var(--surface); border-radius: 10px; padding: 12px; margin-bottom: 14px;
      font-size: 14px;
    }
    .group-summary { display: flex; align-items: center; gap: 10px; color: var(--ink-muted); font-size: 14px; margin-bottom: 4px; }
    .board-card {
      display: flex; gap: 12px; align-items: flex-start;
      padding: 12px 14px; background: var(--surface); position: relative;
    }
    .board-card + .board-card { border-top: 1px solid var(--border-soft); }
    .board-card.tappable { cursor: pointer; }
    .board-card img, .board-card .poster-empty { width: 45px; height: 68px; border-radius: 6px; object-fit: cover; flex: 0 0 auto; background: var(--surface-2); display: flex; align-items: center; justify-content: center; }
    .board-card .t { font-weight: 600; font-size: 16px; }
    .board-card .sub { font-size: 13px; color: var(--ink-muted); margin-top: 3px; }
    .board-card .note { font-size: 13px; color: var(--ink-muted); font-style: italic; margin-top: 3px; }
    .board-card .on-list { font-size: 13px; color: var(--list-watching, #2e8b57); margin-top: 6px; }
    .board-card .act { margin-top: 6px; display: flex; gap: 12px; }
    .board-card .act button { background: none; border: none; padding: 0; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--tint); }
    .board-card .act button.remove { color: var(--danger, #d32f2f); font-weight: 500; }
    .board-empty { text-align: center; color: var(--ink-muted); padding: 32px 20px; }
    .board-empty small { display: block; margin-top: 6px; font-size: 12px; }
    #groupMenu button { color: var(--ink); }

    /* iOS-style show cards — shared with index.html for consistency */
    :root {
      --ios-orange: #FF9500;
    }
    @media (prefers-color-scheme: dark) {
      :root { --ios-orange: #FF9F0A; }
    }



  </style>
  <script src="/show-renderer.js?v=2"></script>
  <script>
    // Set nav context before loading nav.js. No backLabel here on purpose:
    // updateNav() owns the label (it names the view the back button returns
    // to), and nav.js applies ctx.backLabel on DOMContentLoaded — which can
    // land after the first updateNav() and overwrite it with a stale value.
    window.navContext = { page: 'groups' };
  </script>
  <script src="/nav.js"></script>
  <script src="/shell.js?v=5" defer></script>
  <script src="/app-banner.js?v=4" defer></script>
</head>
<body>
  <header>
    <div class="header-top">
      <a id="backLink" class="back" href="#" style="display: none;"></a>
      <h1 id="pageTitle">Groups</h1>
    </div>
  </header>

  <main>
    <!-- Groups List (root view) -->
    <div id="groupsList">
      <div style="margin-bottom: 20px;">
        <button style="background: var(--tint); color: white; border: none; padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; margin-right: 8px;" onclick="showCreateGroupModal()">Create Group</button>
        <button style="background: var(--tint); color: white; border: none; padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer;" onclick="showJoinFlow()">Join a Group</button>
      </div>
      <div id="groupsContainer"></div>
      <div id="emptyGroups" class="empty-state" style="display: none;">
        <h3>No groups yet</h3>
        <p>Create or join a group to get started.</p>
      </div>
    </div>

    <!-- Group View (members + trending) -->
    <div id="groupView">
      <div id="changeNotice" class="change-notice" style="display: none;"></div>
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
        <h2 id="groupViewTitle" style="margin: 0; font-size: 22px; font-weight: 600;"></h2>
        <button id="groupMenuBtn" onclick="toggleGroupMenu()" aria-label="Group actions" style="background: none; border: none; font-size: 20px; cursor: pointer; padding: 8px; color: var(--ink);">⋯</button>
      </div>
      <div id="groupMenu" style="display: none; background: var(--surface); border-radius: 8px; padding: 8px; margin-bottom: 20px;">
        <button id="inviteBtn" onclick="showInviteModal()" style="display: block; width: 100%; text-align: left; padding: 12px; background: none; border: none; cursor: pointer; font-size: 14px; margin-bottom: 8px;">Invite members</button>
        <button id="leaveBtn" onclick="leaveGroup()" style="display: block; width: 100%; text-align: left; padding: 12px; background: none; border: none; cursor: pointer; font-size: 14px; margin-bottom: 8px;">Leave</button>
        <button id="renameBtn" onclick="showRenameModal()" style="display: block; width: 100%; text-align: left; padding: 12px; background: none; border: none; cursor: pointer; font-size: 14px; margin-bottom: 8px;">Rename</button>
        <button id="iconBtn" onclick="showIconModal()" style="display: block; width: 100%; text-align: left; padding: 12px; background: none; border: none; cursor: pointer; font-size: 14px; margin-bottom: 8px;">Change icon</button>
        <button id="deleteBtn" onclick="deleteGroup()" style="display: none; width: 100%; text-align: left; padding: 12px; background: none; border: none; cursor: pointer; font-size: 14px; color: #d32f2f !important;">Delete</button>
      </div>
      <div id="groupSummary" class="group-summary"></div>
      <div class="list-tabs" id="groupTabs"></div>
      <div id="groupTrendingPane"><div id="groupTrendingList" class="show-list"></div></div>
      <div id="groupBoardPane" style="display: none;"></div>
      <div id="groupMembersPane" style="display: none;"><div id="groupMembersList"></div></div>
    </div>

    <!-- Member View (list tabs + shows) -->
    <div id="memberView">
      <h2 id="memberViewTitle" style="margin: 0 0 16px; font-size: 22px; font-weight: 600;"></h2>
      <div class="list-tabs" id="listTabs"></div>
      <div id="memberShowsList" class="show-list"></div>
    </div>

    <!-- Show Detail -->
    <div id="showDetail">
      <h2 id="showDetailTitle" style="margin: 0 0 20px; font-size: 22px; font-weight: 600;"></h2>
      <div id="showDetailContent" style="margin-bottom: 40px;"></div>
    </div>

    <!-- Join Flow -->
    <div id="joinFlow">
      <div class="join-section">
        <h2>Join a Group</h2>
        <p>Enter the invite code to join a group</p>
        <div class="join-input-row">
          <input id="joinTokenInput" type="text" placeholder="Invite code" maxlength="24">
          <button onclick="joinGroup()">Join</button>
        </div>
        <p id="joinStatus" style="font-size: 12px; color: var(--ink-muted); margin: 0;"></p>
      </div>
    </div>
  </main>

  <!-- Create Group Modal -->
  <div id="createGroupModal" class="modal-overlay">
    <div class="modal">
      <h2>Create a Group</h2>
      <input id="groupNameInput" type="text" placeholder="Group name" maxlength="100">
      <div id="createIconPicker"></div>
      <div class="modal-buttons">
        <button class="btn-cancel" onclick="closeCreateGroupModal()">Cancel</button>
        <button class="btn-submit" onclick="createGroup()">Create</button>
      </div>
    </div>
  </div>

  <!-- Invite Modal -->
  <div id="inviteModal" class="modal-overlay">
    <div class="modal">
      <h2>Invite to Group</h2>
      <p style="color: var(--ink-muted); font-size: 13px; margin: 0 0 16px;">Share this link to invite people</p>
      <div style="display: flex; gap: 8px; align-items: center;">
        <input id="inviteLinkInput" class="invite-link-input" type="text" readonly>
        <button id="shareInviteLinkBtn" class="invite-link-btn" onclick="shareInviteLink()" style="display: none;">Share</button>
        <button id="copyInviteLinkBtn" class="invite-link-btn" onclick="copyInviteLink()">Copy</button>
      </div>
      <p id="inviteLinkExpire" style="color: var(--ink-muted); font-size: 12px; margin: 12px 0 0;"></p>
      <div class="modal-buttons" style="margin-top: 20px;">
        <button class="btn-cancel" onclick="closeInviteModal()" style="flex: 1;">Done</button>
      </div>
    </div>
  </div>

  <!-- Rename Modal -->
  <div id="renameModal" class="modal-overlay">
    <div class="modal">
      <h2>Rename Group</h2>
      <input id="renameInput" type="text" placeholder="Group name" maxlength="100">
      <div class="modal-buttons">
        <button class="btn-cancel" onclick="closeRenameModal()">Cancel</button>
        <button class="btn-submit" onclick="renameGroup()">Rename</button>
      </div>
    </div>
  </div>

  <!-- Change icon -->
  <div id="iconModal" class="modal-overlay">
    <div class="modal">
      <h2 style="display: flex; align-items: center; gap: 12px;"><span id="iconModalBadge"></span><span id="iconModalName">Group icon</span></h2>
      <div id="editIconPicker"></div>
      <div class="modal-buttons">
        <button class="btn-cancel" onclick="closeIconModal()">Cancel</button>
        <button class="btn-submit" id="saveIconBtn" onclick="saveIcon()">Save</button>
      </div>
    </div>
  </div>

  <!-- "X has recommended Y" — one unanswered card at a time -->
  <div id="popupModal" class="modal-overlay">
    <div class="modal">
      <h2 id="popupTitle"></h2>
      <p id="popupNote" style="color: var(--ink-muted); font-size: 14px; font-style: italic; margin: -6px 0 16px;"></p>
      <div class="modal-buttons">
        <button class="btn-cancel" onclick="answerPopup('dismiss')">Dismiss</button>
        <button class="btn-submit" onclick="answerPopup('add')">Add to Next Up</button>
      </div>
    </div>
  </div>

  <script>
    // Stack-based navigation
    let navStack = [];
    let authMember = null;
    let currentGroupData = null;
    let currentMemberSlug = null;
    let currentListType = 'watching';
    let currentMemberShows = [];
    let detailShow = null;
    let detailMyCopy = null;
    let detailActors = [];
    // { average, count, seasons, mine, mineSeasons, owner, ownerSeasons,
    //   ownerName } — rides along on GET /api/shows/:id.
    let detailRatings = null;
    let detailGroupWatchers = [];
    let detailCreators = [];

    const ALL_LISTS = ['watching', 'waiting', 'recommending', 'next'];
    const LIST_LABELS = {
      watching: 'Watching',
      waiting: 'Awaiting',
      recommending: 'Loved',
      next: 'Next Up'
    };

    // Opening Groups clears the NEW flag on the Groups nav row (index.html
    // and shell.js read the same key), as iOS's seenGroups does.
    try { localStorage.setItem('seenGroups', '1'); } catch (e) {}

    // A logged-out visitor holding an invite link: sign in first, then come
    // back here with the token — index.html's return_to (the same path
    // Connected Apps uses) replays it. It used to drop the token on the floor.
    function signInThenReturn() {
      const token = new URLSearchParams(window.location.search).get('token');
      if (token && /^[A-Za-z0-9_-]{1,64}$/.test(token)) {
        window.location.href = '/?login=1&return_to=' + encodeURIComponent('/groups?token=' + token);
      } else {
        window.location.href = '/';
      }
    }

    // Initialize on page load
    (async () => {
      try {
        const res = await fetch('/auth/check', {
          headers: { 'X-Client-Platform': window.innerWidth < 768 ? 'web-small' : 'web-large' },
        });
        if (res.ok) {
          const data = await res.json();
          authMember = data.member;
          if (!authMember) {
            signInThenReturn();
            return;
          }
          const params = new URLSearchParams(window.location.search);
          const joinToken = params.get('token');
          if (joinToken) {
            showJoinPreview(joinToken);
          } else {
            navPush('groupsList', loadGroupsList);
          }
        } else {
          signInThenReturn();
        }
      } catch (e) {
        console.error('Auth check failed:', e);
        window.location.href = '/';
      }
    })();

    // ── Group icons ──────────────────────────────────────────────────────
    // Same curated sets as functions/_shared/group-icons.js (the server is
    // the gate), drawn as emoji since a browser has no SF Symbols.
    const GROUP_ICON_EMOJI = {
      'person.2.fill': '👥', 'person.3.fill': '👨‍👩‍👧', 'house.fill': '🏠', 'sofa.fill': '🛋️',
      'tv.fill': '📺', 'film.fill': '🎬', 'theatermasks.fill': '🎭', 'star.fill': '⭐',
      'heart.fill': '❤️', 'flame.fill': '🔥', 'sparkles': '✨', 'moon.stars.fill': '🌙',
      'sun.max.fill': '☀️', 'bolt.fill': '⚡', 'crown.fill': '👑', 'gamecontroller.fill': '🎮',
      'pawprint.fill': '🐾', 'leaf.fill': '🍃', 'book.fill': '📖', 'music.note': '🎵',
      'globe.americas.fill': '🌎', 'airplane': '✈️', 'fork.knife': '🍴', 'cup.and.saucer.fill': '☕',
    };
    const GROUP_COLOR_HEX = {
      red: '#FF3B30', orange: '#FF9500', yellow: '#FFCC00', green: '#34C759', teal: '#30B0C7',
      blue: '#007AFF', indigo: '#5856D6', purple: '#AF52DE', pink: '#FF2D55', brown: '#A2845E',
    };
    function groupBadge(icon, color, size) {
      const emoji = GROUP_ICON_EMOJI[icon] || GROUP_ICON_EMOJI['person.2.fill'];
      const bg = GROUP_COLOR_HEX[color] || '#8E8E93';
      return `<span class="group-badge" aria-hidden="true" style="--gb:${bg}; width:${size}px; height:${size}px; font-size:${Math.round(size * 0.5)}px;">${emoji}</span>`;
    }
    // A picker writing into `draft` ({icon, color}); tapping the selected
    // icon again clears it, like the app.
    function renderIconPicker(containerId, draft, onChange) {
      const el = document.getElementById(containerId);
      const bg = GROUP_COLOR_HEX[draft.color] || '#8E8E93';
      el.innerHTML = `<div class="icon-grid" style="--gb:${bg}">` +
        Object.keys(GROUP_ICON_EMOJI).map(sym =>
          `<button type="button" class="${draft.icon === sym ? 'selected' : ''}" data-icon="${sym}" aria-label="${sym.replace(/\./g, ' ')}" aria-pressed="${draft.icon === sym}">${GROUP_ICON_EMOJI[sym]}</button>`
        ).join('') + '</div><div class="swatches">' +
        `<button type="button" class="none${!draft.color ? ' selected' : ''}" data-color="" aria-label="No color">∅</button>` +
        Object.keys(GROUP_COLOR_HEX).map(c =>
          `<button type="button" class="${draft.color === c ? 'selected' : ''}" data-color="${c}" style="--sw:${GROUP_COLOR_HEX[c]}" aria-label="${c}"></button>`
        ).join('') + '</div>';
      el.querySelectorAll('[data-icon]').forEach(b => b.addEventListener('click', () => {
        draft.icon = draft.icon === b.dataset.icon ? null : b.dataset.icon;
        renderIconPicker(containerId, draft, onChange); if (onChange) onChange();
      }));
      el.querySelectorAll('[data-color]').forEach(b => b.addEventListener('click', () => {
        draft.color = b.dataset.color || null;
        renderIconPicker(containerId, draft, onChange); if (onChange) onChange();
      }));
    }

    // Navigation stack management
    function navPush(view, loadFn) {
      navStack.push(view);
      updateNav();
      if (loadFn) loadFn();
    }

    function navBack() {
      if (navStack.length > 1) {
        navStack.pop();
        updateNav();
        const view = navStack[navStack.length - 1];
        if (view === 'groupsList') loadGroupsList();
        else if (view === 'groupView') renderGroupView();
        else if (view === 'memberView') renderMemberView();
      } else {
        // Root of the stack: nothing to pop, so leave for the home page.
        window.location.href = '/';
      }
    }

    function updateNav() {
      const view = navStack[navStack.length - 1];
      document.getElementById('groupsList').style.display = view === 'groupsList' ? 'block' : 'none';
      document.getElementById('groupView').style.display = view === 'groupView' ? 'block' : 'none';
      document.getElementById('memberView').style.display = view === 'memberView' ? 'block' : 'none';
      document.getElementById('showDetail').style.display = view === 'showDetail' ? 'block' : 'none';
      document.getElementById('joinFlow').style.display = view === 'joinFlow' ? 'block' : 'none';

      const back = backDestination();
      const backLink = document.getElementById('backLink');
      if (backLink) {
        backLink.style.display = '';
        // Marks a back that pops a view rather than leaving the page. At
        // >=1024px the shell sidebar owns Home, so only this kind survives
        // (see the media query above and the matching rule in shell.js).
        backLink.classList.toggle('is-in-page', back.inPage);
        backLink.href = back.inPage ? '#' : '/';
        backLink.setAttribute('aria-label', back.inPage ? 'Back to ' + back.label : 'Back to home');
        backLink.title = back.label;
      }
      window.updateNavLabel(back.label);
    }

    // The back control names where it GOES, not where you are: from a
    // member's shows it reads the group you came from; from a show detail
    // it reads that member (or the group, if you opened it from group
    // trending). At the root of the stack there is nothing to pop, so it
    // leaves for the home page instead.
    function backDestination() {
      const dest = navStack[navStack.length - 2];
      if (!dest) return { label: 'Home', inPage: false };
      if (dest === 'groupView') {
        return { label: currentGroupData?.group?.name || 'Group', inPage: true };
      }
      if (dest === 'memberView') {
        const member = currentGroupData?.members?.find(m => m.slug === currentMemberSlug);
        return { label: member?.first_name || currentMemberSlug || 'Member', inPage: true };
      }
      return { label: 'Groups', inPage: true };
    }

    // Views
    async function loadGroupsList() {
      try {
        const res = await fetch('/api/groups');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        window.__recommendGroups = (data.groups || []).map(g => ({ id: g.id, name: g.name }));
        document.getElementById('pageTitle').textContent = 'Groups';
        const container = document.getElementById('groupsContainer');
        const empty = document.getElementById('emptyGroups');

        if (data.groups.length === 0) {
          container.innerHTML = '';
          empty.style.display = 'block';
          return;
        }
        empty.style.display = 'none';
        container.innerHTML = '<div class="ios-group">' + data.groups.map(g => `
          <button type="button" class="ios-item" onclick="openGroup(${g.id})">
            ${groupBadge(g.icon, g.color, 30)}
            <span class="ios-item-label">${escapeHtml(g.name)}</span>
            <span class="ios-item-detail">${g.member_count} member${g.member_count !== 1 ? 's' : ''}</span>
            <svg class="ic ios-item-chev"><use href="#s-chevron-right"/></svg>
          </button>
        `).join('') + '</div>';
      } catch (e) {
        console.error('Failed to load groups:', e);
        document.getElementById('groupsContainer').innerHTML = '<p>Error loading groups. Try again.</p>';
      }
    }

    async function openGroup(groupId) {
      try {
        const res = await fetch(`/api/groups/${groupId}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        currentGroupData = data;
        currentMemberSlug = null;
        currentListType = 'watching';
        groupTab = 'trending';
        popupQueueStarted = false;
        navPush('groupView', renderGroupView);
      } catch (e) {
        console.error('Failed to load group:', e);
        alert('Error loading group');
      }
    }

    // Trending / Watch Next / Members, as on iOS. Kept across back-navigation
    // within the visit so returning from a show lands on the same tab.
    let groupTab = 'trending';
    let groupSuggestions = [];
    let popupQueueStarted = false;
    let pendingPopup = null;

    function setGroupTab(tab) { groupTab = tab; renderGroupTabs(); }
    function renderGroupTabs() {
      const tabs = [['trending', 'Trending'], ['watchnext', 'Watch Next'], ['members', 'Members']];
      document.getElementById('groupTabs').innerHTML = tabs.map(([k, label]) =>
        `<button class="list-tab${k === groupTab ? ' active' : ''}" onclick="setGroupTab('${k}')">${label}</button>`).join('');
      document.getElementById('groupTrendingPane').style.display = groupTab === 'trending' ? 'block' : 'none';
      document.getElementById('groupBoardPane').style.display = groupTab === 'watchnext' ? 'block' : 'none';
      document.getElementById('groupMembersPane').style.display = groupTab === 'members' ? 'block' : 'none';
    }

    // "Alex renamed the group and changed its icon." Same wording as
    // GroupChangeNotice.summary. The server sends it once per member.
    function changeNoticeText(n) {
      const name = n.changed_by_name || n.changed_by || 'Someone';
      const f = n.changed_fields || [];
      const hasName = f.includes('name'), hasIcon = f.includes('icon');
      if (hasName && hasIcon) return `${name} renamed the group and changed its icon.`;
      if (hasName) return `${name} renamed the group.`;
      if (hasIcon) return `${name} changed the group's icon.`;
      return `${name} updated the group.`;
    }

    async function renderGroupView() {
      if (!currentGroupData) return;
      const g = currentGroupData.group;
      document.getElementById('pageTitle').textContent = g.name;
      document.getElementById('groupViewTitle').textContent = g.name;
      // Rename and Change icon are open to every member (the server allows
      // it, migration 068); the others find out from the change notice.
      // Delete stays creator-only.
      document.getElementById('deleteBtn').style.display = currentGroupData.is_creator ? 'block' : 'none';

      const notice = document.getElementById('changeNotice');
      if (currentGroupData.change_notice) {
        notice.innerHTML = `<span aria-hidden="true">ℹ️</span><span>${escapeHtml(changeNoticeText(currentGroupData.change_notice))}</span>`;
        notice.style.display = 'flex';
      } else {
        notice.style.display = 'none';
      }
      const n = currentGroupData.members.length;
      document.getElementById('groupSummary').innerHTML =
        `${groupBadge(g.icon, g.color, 30)}<span>${n} member${n === 1 ? '' : 's'}</span>`;
      renderGroupTabs();

      // Members
      const membersList = document.getElementById('groupMembersList');
      membersList.innerHTML = '<div class="ios-group">' + currentGroupData.members.map(m => `
        <button type="button" class="ios-item no-icon" onclick="openMember('${escapeHtml(m.slug)}')">
          <span class="ios-item-label">${escapeHtml(m.first_name || m.slug)}</span>
          <span class="ios-item-detail">${m.show_count} show${m.show_count !== 1 ? 's' : ''} • ${m.watching_count || 0} watching</span>
          <svg class="ic ios-item-chev"><use href="#s-chevron-right"/></svg>
        </button>
      `).join('') + '</div>';

      // Trending
      try {
        const res = await fetch(`/api/groups/${g.id}/trending`);
        if (res.ok) {
          const data = await res.json();
          const shows = data.shows || [];
          document.getElementById('groupTrendingList').innerHTML = shows.length
            ? shows.map(show => renderShowCard(show, {
                onClickId: openShowFromList,
                showRating: true,
                showChevron: true,
                // Whose lists it's on, worded as on iOS; the network line
                // when the endpoint named nobody.
                caption: show.members && show.members.length ? `Added by: ${escapeHtml(show.members.join(', '))}` : undefined,
              })).join('')
            : '<div class="board-empty">🔥<br>No shows yet</div>';
        }
      } catch (e) {
        console.error('Failed to load trending:', e);
      }

      await loadBoard();
    }

    // ── Watch Next board (migration 065) ─────────────────────────────────
    // Pull-only: recommending writes a card the group owns; Add to Next Up
    // runs under my session onto my own list; Dismiss is a mark about me.
    async function loadBoard() {
      if (!currentGroupData) return;
      try {
        const res = await fetch(`/api/groups/${currentGroupData.group.id}/suggestions`);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        groupSuggestions = (await res.json()).suggestions || [];
      } catch (e) {
        // Non-fatal, like iOS: a board that fails to load shouldn't blank the group.
        groupSuggestions = [];
      }
      renderBoard();
      // Opening the group IS the delivery moment for "X has recommended Y"
      // (there's no push). Once per visit to the group.
      if (!popupQueueStarted) { popupQueueStarted = true; advancePopup(); }
    }

    function renderBoard() {
      const pane = document.getElementById('groupBoardPane');
      if (!groupSuggestions.length) {
        pane.innerHTML = `<div class="board-empty">📣<br>No recommendations yet
          <small>Recommend a show from its detail page and the group sees it here.</small></div>`;
        return;
      }
      const isCreator = !!currentGroupData.is_creator;
      pane.innerHTML = '<div class="ios-group">' + groupSuggestions.map(s => {
        const poster = s.poster_url ? `<img src="${safeUrl(s.poster_url)}" alt="" loading="lazy">` : '<div class="poster-empty">🎬</div>';
        const by = s.is_yours ? 'Your recommendation' : `Recommended by ${escapeHtml(s.suggested_by_name)}`;
        const note = s.note ? `<div class="note">“${escapeHtml(s.note)}”</div>` : '';
        const added = (s.added_names || []).length ? `<div class="sub">Added by ${escapeHtml(s.added_names.join(', '))}</div>` : '';
        let status = '';
        if (s.on_your_list) status = `<div class="on-list">✓ On your ${escapeHtml(LIST_LABELS[s.on_your_list] || s.on_your_list)} list</div>`;
        const actions = [];
        if (!s.on_your_list && !s.is_yours) actions.push(`<button type="button" onclick="event.stopPropagation(); respondSuggestion(${s.id}, 'add')">＋ Add to Next Up</button>`);
        // The two hands the server allows: the recommender, or the creator.
        if (s.is_yours || isCreator) actions.push(`<button type="button" class="remove" onclick="event.stopPropagation(); removeSuggestion(${s.id})">Remove</button>`);
        const tap = s.show_id ? ` tappable" onclick="openShowFromList(${Number(s.show_id)})` : '';
        return `<div class="board-card${tap}">${poster}<div style="min-width:0">
          <div class="t">${escapeHtml(s.title)}</div><div class="sub">${by}</div>${note}${added}${status}
          ${actions.length ? `<div class="act">${actions.join('')}</div>` : ''}</div></div>`;
      }).join('') + '</div>';
    }

    async function respondSuggestion(sid, response) {
      try {
        const res = await fetch(`/api/groups/${currentGroupData.group.id}/suggestions/${sid}`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ response }),
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const i = groupSuggestions.findIndex(x => x.id === data.suggestion.id);
        if (i >= 0) groupSuggestions[i] = data.suggestion;
        renderBoard();
        return true;
      } catch (e) {
        alert('Couldn’t save that. Please try again.');
        return false;
      }
    }

    async function removeSuggestion(sid) {
      if (!confirm('Remove this recommendation from the board?')) return;
      try {
        const res = await fetch(`/api/groups/${currentGroupData.group.id}/suggestions/${sid}`, { method: 'DELETE' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        groupSuggestions = groupSuggestions.filter(x => x.id !== sid);
        renderBoard();
      } catch (e) {
        alert('Couldn’t remove the recommendation.');
      }
    }

    // The next card I haven't answered and didn't write.
    function advancePopup() {
      pendingPopup = groupSuggestions.find(s => !s.is_yours && !s.your_response) || null;
      const modal = document.getElementById('popupModal');
      if (!pendingPopup) { modal.classList.remove('open'); return; }
      document.getElementById('popupTitle').textContent = `${pendingPopup.suggested_by_name} has recommended ${pendingPopup.title}`;
      document.getElementById('popupNote').textContent = pendingPopup.note ? `“${pendingPopup.note}”` : '';
      modal.classList.add('open');
    }
    async function answerPopup(response) {
      if (!pendingPopup) return;
      const ok = await respondSuggestion(pendingPopup.id, response);
      // A failed save ends the queue for this visit rather than re-asking;
      // the card stays unanswered server-side, so the next visit asks again.
      if (ok) advancePopup();
      else { pendingPopup = null; document.getElementById('popupModal').classList.remove('open'); }
    }

    async function openMember(memberSlug) {
      currentMemberSlug = memberSlug;
      currentListType = 'watching';
      try {
        const res = await fetch(`/api/shows?member=${encodeURIComponent(memberSlug)}`);
        if (res.ok) {
          const data = await res.json();
          currentMemberShows = data.shows || [];
        }
      } catch (e) {
        console.error('Failed to load member shows:', e);
        currentMemberShows = [];
      }
      navPush('memberView', renderMemberView);
    }

    function renderMemberView() {
      if (!currentMemberSlug) return;
      const member = currentGroupData.members.find(m => m.slug === currentMemberSlug);
      document.getElementById('pageTitle').textContent = member?.first_name || currentMemberSlug;
      document.getElementById('memberViewTitle').textContent = `${member?.first_name || currentMemberSlug}'s Shows`;

      // List tabs
      const tabs = document.getElementById('listTabs');
      tabs.innerHTML = ALL_LISTS.map(list => `
        <button class="list-tab${list === currentListType ? ' active' : ''}" onclick="switchList('${list}')">
          ${LIST_LABELS[list]}
        </button>
      `).join('');

      // Shows for current list
      const filtered = currentMemberShows.filter(s => s.list === currentListType && !s.archived);
      document.getElementById('memberShowsList').innerHTML = renderShowList(filtered, {
        onClickId: openShowFromList,
        showRating: true,
        showChevron: true,
        currentTab: currentListType
      });
    }

    function switchList(list) {
      currentListType = list;
      renderMemberView();
    }

    async function openShowFromList(showId) {
      detailShow = null;
      detailMyCopy = null;
      detailActors = [];
      detailRatings = null;
      detailGroupWatchers = [];
      detailCreators = [];

      try {
        const res = await fetch('/api/shows/' + showId);
        if (res.ok) {
          const data = await res.json();
          detailShow = data.show;
          detailRatings = data.ratings || null;
          detailGroupWatchers = data.group_watchers || [];
          detailCreators = data.creators || [];
        }
        if (!detailShow) return;

        try {
          const ar = await fetch('/api/shows/' + showId + '/actors');
          if (ar.ok) {
            const ad = await ar.json();
            detailActors = ad.actors || [];
          }
        } catch {}

        await resolveMyCopy(detailShow);
        navPush('showDetail', renderShowDetail);
      } catch (e) {
        console.error('Failed to load show:', e);
      }
    }

    async function resolveMyCopy(show) {
      detailMyCopy = null;
      if (!authMember || !show) return;
      try {
        const res = await fetch(`/api/shows?member=${encodeURIComponent(authMember)}&include_archived=1`);
        if (!res.ok) return;
        const d = await res.json();
        const t = (show.title || '').toLowerCase();
        const id = show.tmdb_id ? Number(show.tmdb_id) : null;
        detailMyCopy = (d.shows || []).find(s => (id && s.tmdb_id)
          ? Number(s.tmdb_id) === id && !!s.movie === !!show.movie
          : (s.title || '').toLowerCase() === t) || null;
      } catch {}
    }

    function renderShowDetail() {
      if (!detailShow) return;
      document.getElementById('pageTitle').textContent = detailShow.title;
      document.getElementById('showDetailTitle').textContent = detailShow.title;
      // Same body as the main app's detail screen (show-renderer.js). Edit /
      // Archive are left off: this page has no edit modal, and the browsing
      // stack here is for looking at somebody else's list. Everything else —
      // the list chips, ratings entry, catalog rows — behaves identically.
      document.getElementById('showDetailContent').innerHTML = renderShowDetailBody(detailShow, {
        actors: detailActors,
        loggedIn: !!authMember,
        myCopy: detailMyCopy,
        ratings: detailRatings,
        listLabels: LIST_LABELS,
        allLists: ALL_LISTS,
        groupWatchers: detailGroupWatchers,
        creators: detailCreators,
        groups: window.__recommendGroups || [],
      });
    }

    // Instant-save rating from the tap-row, then re-render from the fresh
    // ratings the endpoint hands back.
    async function detailRate(value, season) {
      if (!detailMyCopy) return;
      try {
        const res = await fetch(`/api/shows/${detailMyCopy.id}/rating`, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(season === null ? { rating: value } : { rating: value, season }),
        });
        if (!res.ok) { alert('Could not save rating'); return; }
        const data = await res.json();
        detailRatings = data.ratings;
        renderShowDetail();
      } catch (e) {
        console.error('Failed to save rating:', e);
      }
    }

    async function detailChip(list) {
      if (!detailMyCopy) {
        await detailAdd(list);
      } else if (detailMyCopy.archived) {
        await detailRestore(detailMyCopy.id, list);
      } else if (detailMyCopy.list === list) {
        return;
      } else {
        await detailMove(detailMyCopy.id, list);
      }
    }

    async function detailAdd(list) {
      if (!detailShow || !authMember) return;
      try {
        const res = await fetch('/api/shows', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title: detailShow.title,
            network: detailShow.network,
            network_url: detailShow.network_url,
            list: list,
            movie: detailShow.movie,
            tmdb_id: detailShow.tmdb_id,
            tmdb_type: detailShow.tmdb_type
          })
        });
        if (!res.ok) return;
        const data = await res.json();
        detailMyCopy = data.show;
        renderShowDetail();
        if (currentMemberSlug) {
          await resolveMemberShows();
          renderMemberView();
        }
      } catch (e) {
        console.error('Failed to add show:', e);
      }
    }

    async function detailMove(id, list) {
      try {
        const res = await fetch(`/api/shows/${id}/move`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ list })
        });
        if (!res.ok) return;
        await resolveMyCopy(detailShow);
        renderShowDetail();
        if (currentMemberSlug) {
          await resolveMemberShows();
          renderMemberView();
        }
      } catch (e) {
        console.error('Failed to move show:', e);
      }
    }

    async function detailRestore(id, list) {
      try {
        const res = await fetch(`/api/shows/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ archived: 0, list })
        });
        if (!res.ok) return;
        await resolveMyCopy(detailShow);
        renderShowDetail();
        if (currentMemberSlug) {
          await resolveMemberShows();
          renderMemberView();
        }
      } catch (e) {
        console.error('Failed to restore show:', e);
      }
    }

    async function resolveMemberShows() {
      if (!currentMemberSlug) return;
      try {
        const res = await fetch(`/api/shows?member=${encodeURIComponent(currentMemberSlug)}`);
        if (res.ok) {
          const data = await res.json();
          currentMemberShows = data.shows || [];
        }
      } catch {}
    }

    // Group management
    function toggleGroupMenu() {
      const menu = document.getElementById('groupMenu');
      menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
    }

    function showInviteModal() {
      if (!currentGroupData) return;
      generateNewInvite();
    }

    // Every call mints a new invite server-side, so a double click must not
    // mint two.
    let generatingInvite = false;
    async function generateNewInvite() {
      if (generatingInvite) return;
      generatingInvite = true;
      try {
        const res = await fetch(`/api/groups/${currentGroupData.group.id}/invite`, { method: 'POST' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        openInviteSheet(await res.json(), currentGroupData.group.name);
        toggleGroupMenu();
      } catch (e) {
        console.error('Failed to generate invite:', e);
        alert('Couldn’t make an invite link. Please try again.');
      } finally {
        generatingInvite = false;
      }
    }

    // What the link promises: "Good for up to 10 people · Expires on Oct 10,
    // 2026" — either half left out if the server didn't say it.
    let inviteGroupName = '';
    function openInviteSheet(invite, groupName) {
      inviteGroupName = (groupName || '').trim() || 'my group';
      document.getElementById('inviteLinkInput').value = invite.url;
      const parts = [];
      if (invite.max_uses) parts.push(`Good for up to ${invite.max_uses} ${invite.max_uses === 1 ? 'person' : 'people'}`);
      const d = new Date(invite.expires_at);
      if (!isNaN(d)) parts.push(`Expires on ${d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })}`);
      document.getElementById('inviteLinkExpire').textContent = parts.join(' · ');
      document.getElementById('shareInviteLinkBtn').style.display = navigator.share ? '' : 'none';
      document.getElementById('copyInviteLinkBtn').textContent = 'Copy';
      document.getElementById('inviteModal').classList.add('open');
    }

    async function shareInviteLink() {
      const url = document.getElementById('inviteLinkInput').value;
      try {
        await navigator.share({
          title: `Join ${inviteGroupName} on Show Picker Club`,
          text: `Join ${inviteGroupName} on Show Picker Club and we'll see what each other is watching.`,
          url,
        });
      } catch (e) {}
    }

    function closeInviteModal() {
      document.getElementById('inviteModal').classList.remove('open');
    }

    async function copyInviteLink() {
      const input = document.getElementById('inviteLinkInput');
      try { await navigator.clipboard.writeText(input.value); }
      catch (e) { input.select(); document.execCommand('copy'); }
      const btn = document.getElementById('copyInviteLinkBtn');
      btn.textContent = 'Copied!';
      setTimeout(() => { btn.textContent = 'Copy'; }, 2000);
    }

    async function leaveGroup() {
      if (!confirm('Leave this group?')) return;
      try {
        const res = await fetch(`/api/groups/${currentGroupData.group.id}/leave`, { method: 'POST' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        navStack = ['groupsList'];
        updateNav();
        loadGroupsList();
        toggleGroupMenu();
      } catch (e) {
        console.error('Failed to leave group:', e);
      }
    }

    async function deleteGroup() {
      if (!confirm('Delete this group? This cannot be undone.')) return;
      try {
        const res = await fetch(`/api/groups/${currentGroupData.group.id}`, { method: 'DELETE' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        navStack = ['groupsList'];
        updateNav();
        loadGroupsList();
        toggleGroupMenu();
      } catch (e) {
        console.error('Failed to delete group:', e);
      }
    }

    function showRenameModal() {
      if (!currentGroupData) return;
      document.getElementById('renameInput').value = currentGroupData.group.name;
      document.getElementById('renameModal').classList.add('open');
      document.getElementById('renameInput').focus();
      document.getElementById('renameInput').select();
      toggleGroupMenu();
    }

    function closeRenameModal() {
      document.getElementById('renameModal').classList.remove('open');
      document.getElementById('renameInput').value = '';
    }

    async function renameGroup() {
      const newName = document.getElementById('renameInput').value.trim();
      if (!newName) {
        alert('Please enter a group name');
        return;
      }
      if (newName === currentGroupData.group.name) {
        closeRenameModal();
        return;
      }
      try {
        const res = await fetch(`/api/groups/${currentGroupData.group.id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: newName })
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        currentGroupData.group = { ...currentGroupData.group, ...data.group };
        document.getElementById('groupViewTitle').textContent = currentGroupData.group.name;
        document.getElementById('pageTitle').textContent = currentGroupData.group.name;
        closeRenameModal();
      } catch (e) {
        console.error('Failed to rename group:', e);
        alert('Failed to rename group');
      }
    }

    // Change icon — drafted, then saved in one PATCH so Cancel changes nothing.
    let iconDraft = { icon: null, color: null };
    function refreshIconModalBadge() {
      document.getElementById('iconModalBadge').innerHTML = groupBadge(iconDraft.icon, iconDraft.color, 44);
    }
    function showIconModal() {
      if (!currentGroupData) return;
      iconDraft = { icon: currentGroupData.group.icon || null, color: currentGroupData.group.color || null };
      document.getElementById('iconModalName').textContent = currentGroupData.group.name;
      renderIconPicker('editIconPicker', iconDraft, refreshIconModalBadge);
      refreshIconModalBadge();
      document.getElementById('iconModal').classList.add('open');
      toggleGroupMenu();
    }
    function closeIconModal() { document.getElementById('iconModal').classList.remove('open'); }
    async function saveIcon() {
      const btn = document.getElementById('saveIconBtn');
      btn.disabled = true;
      try {
        const res = await fetch(`/api/groups/${currentGroupData.group.id}`, {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ icon: iconDraft.icon, color: iconDraft.color }),
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        currentGroupData.group = { ...currentGroupData.group, ...data.group };
        closeIconModal();
        renderGroupView();
      } catch (e) {
        alert('Couldn’t save the group icon.');
      } finally {
        btn.disabled = false;
      }
    }

    // Modals
    let createDraft = { icon: null, color: null };
    function showCreateGroupModal() {
      createDraft = { icon: null, color: null };
      renderIconPicker('createIconPicker', createDraft);
      document.getElementById('createGroupModal').classList.add('open');
      document.getElementById('groupNameInput').focus();
    }

    function closeCreateGroupModal() {
      document.getElementById('createGroupModal').classList.remove('open');
      document.getElementById('groupNameInput').value = '';
    }

    async function createGroup() {
      const name = document.getElementById('groupNameInput').value.trim();
      if (!name) {
        alert('Please enter a group name');
        return;
      }
      try {
        const res = await fetch('/api/groups', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, icon: createDraft.icon, color: createDraft.color })
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        closeCreateGroupModal();
        openInviteSheet(data.invite, name);
        setTimeout(loadGroupsList, 500);
      } catch (e) {
        console.error('Failed to create group:', e);
      }
    }

    function showJoinFlow() {
      navPush('joinFlow', () => {
        document.getElementById('pageTitle').textContent = 'Join a Group';
        document.getElementById('joinTokenInput').focus();
      });
    }

    async function showJoinPreview(token) {
      try {
        const res = await fetch(`/api/groups/join?token=${encodeURIComponent(token)}`);
        if (!res.ok) {
          window.location.href = '/groups';
          return;
        }
        const data = await res.json();
        if (data.join_required) {
          navPush('joinFlow', () => {
            document.getElementById('pageTitle').textContent = 'Join a Group';
            document.getElementById('joinTokenInput').value = token;
          });
        } else if (data.ok) {
          window.location.href = '/groups';
        }
      } catch (e) {
        console.error('Failed to preview invite:', e);
        window.location.href = '/groups';
      }
    }

    async function joinGroup() {
      const token = document.getElementById('joinTokenInput').value.trim();
      if (!token) {
        alert('Please enter an invite code');
        return;
      }
      try {
        const res = await fetch(`/api/groups/join?token=${encodeURIComponent(token)}`);
        if (res.status === 409) {
          alert('You\'re already in this group');
          return;
        }
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        alert('Successfully joined the group!');
        navStack = ['groupsList'];
        updateNav();
        loadGroupsList();
      } catch (e) {
        console.error('Failed to join group:', e);
      }
    }

    // Global click handler for show renderer
    window.__showRendererClickHandler = (showId) => {
      openShowFromList(showId);
    };
  </script>
</body>
</html>
