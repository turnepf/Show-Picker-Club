<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Groups — Show Picker Club</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Show Picker">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-itunes-app" content="app-id=6780282764">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfaf8">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#292522">
  <link rel="stylesheet" href="/styles.css?v=5">
  <style>
    :root { --tint: #6D63EB; }
    @media (prefers-color-scheme: dark) { :root { --tint: #8D87F5; } }
    body { padding-top: 0; }
    header {
      background: color-mix(in srgb, var(--surface-2) 86%, transparent);
      -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
      color: var(--ink);
      border-bottom: 1px solid var(--border-soft);
      padding: 12px 20px;
      padding-top: calc(12px + env(safe-area-inset-top, 0px));
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-top {
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 720px;
      margin: 0 auto;
      position: relative;
    }
    .header-top a.back {
      color: var(--tint);
      text-decoration: none;
      font-size: 16px;
      line-height: 1;
      padding: 6px 10px 6px 0;
      position: relative; z-index: 1;
    }
    @media (min-width: 1024px) {
      .header-top a.back { display: none !important; }
    }
    .header-top h1 {
      font-family: var(--font-sans);
      font-size: 17px;
      font-weight: 600;
      position: absolute;
      left: 50%; transform: translateX(-50%);
      white-space: nowrap;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }
    .group-card {
      background: var(--surface);
      border: 1px solid var(--border-soft);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .group-card:hover { border-color: var(--tint); }
    .group-card h3 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
    .group-card p { margin: 0; font-size: 13px; color: var(--ink-muted); }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.3);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface);
      border-radius: 12px;
      padding: 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .modal h2 { margin: 0 0 16px; font-size: 18px; font-weight: 600; }
    .modal input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-soft);
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
      box-sizing: border-box;
    }
    .modal input:focus { outline: none; border-color: var(--tint); }
    .modal-buttons { display: flex; gap: 8px; }
    .modal-buttons button { flex: 1; padding: 10px; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; }
    .modal-buttons .btn-cancel { background: var(--surface-2); color: var(--ink); }
    .modal-buttons .btn-submit { background: var(--tint); color: white; }

    .invite-link-input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--border-soft);
      border-radius: 6px;
      font-size: 12px;
      background: var(--surface);
      color: var(--ink);
      font-family: monospace;
    }
    .invite-link-btn {
      padding: 8px 12px;
      background: var(--tint);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }
    .invite-link-btn:hover { opacity: 0.9; }

    .join-section {
      text-align: center;
      padding: 40px 20px;
    }
    .join-section h2 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
    .join-section p { color: var(--ink-muted); font-size: 14px; margin: 0 0 20px; }
    .join-input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .join-input-row input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid var(--border-soft);
      border-radius: 8px;
      font-size: 14px;
    }
    .join-input-row button {
      padding: 10px 20px;
      background: var(--tint);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--ink-muted);
    }
    .empty-state h3 { font-size: 16px; margin: 0 0 8px; }
    .empty-state p { font-size: 13px; margin: 0; }

    .member-row {
      padding: 12px 0;
      border-bottom: 1px solid var(--border-soft);
      cursor: pointer;
    }
    .member-row:last-child { border-bottom: none; }
    .member-row h4 { margin: 0; font-size: 15px; font-weight: 500; }
    .member-row p { margin: 4px 0 0; font-size: 13px; color: var(--ink-muted); }

    .list-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-soft);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .list-tab {
      padding: 12px 16px;
      border: none;
      background: none;
      font-size: 15px;
      font-weight: 500;
      color: var(--ink-muted);
      cursor: pointer;
      white-space: nowrap;
      border-bottom: 3px solid transparent;
      position: relative;
      bottom: -1px;
    }
    .list-tab.active {
      color: var(--ink);
      border-bottom-color: var(--tint);
    }

    #groupsList { display: none; }
    #groupView { display: none; }
    #memberView { display: none; }
    #showDetail { display: none; }
    #joinFlow { display: none; }

    body { background: var(--surface-2); }

    /* iOS-style show cards — shared with index.html for consistency */
    :root {
      --ios-orange: #FF9500;
    }
    @media (prefers-color-scheme: dark) {
      :root { --ios-orange: #FF9F0A; }
    }

    .show-list {
      background: var(--surface);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 1px 3px oklch(0.18 0.03 50 / 0.06);
    }
    .show-list:empty { display: none; }
    .show { border-bottom: 1px solid var(--border-soft); }
    .show-row { padding: 12px 14px; align-items: center; }

    .ios-row { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .ios-row:active { background: var(--surface-2); }
    .ios-row .ios-row-main { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
    .row-poster {
      width: 42px; height: 63px; flex-shrink: 0;
      object-fit: cover; border-radius: 6px; background: var(--surface-2, rgba(0,0,0,0.06));
    }
    .row-poster-empty {
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; opacity: 0.5;
    }
    .ios-row-text { flex: 1; min-width: 0; }
    .ios-row-title { font-weight: 600; color: var(--ink); font-size: 15px; line-height: 1.3; }
    .ios-row .show-sub { font-size: 12px; color: var(--ink-muted); margin-top: 2px; }
    .ios-row .show-rating { flex: 0 0 auto; }
    .ios-row-chevron { flex: 0 0 auto; color: var(--ink-faint); font-weight: 700; font-size: 18px; line-height: 1; }

    .show-rating { color: var(--ink-muted); font-size: 13px; white-space: nowrap; }
    .show-rating .star { color: var(--star); }
    .show-movie { font-weight: 400; color: var(--ink-quiet); font-size: 12px; }

    .drag-hint {
      text-align: center; font-size: 12px; color: var(--accent);
      padding: 2px 0 10px;
    }
    .drag-handle {
      font-size: 20px; line-height: 1; color: var(--ink-faint);
      padding: 10px 2px 10px 12px;
      cursor: grab;
      touch-action: none;
      user-select: none; -webkit-user-select: none;
    }
    .ios-row.dragging {
      opacity: 0.85;
      box-shadow: var(--shadow-card);
      transform: scale(1.01);
      position: relative; z-index: 5;
    }
    body.no-select { user-select: none; -webkit-user-select: none; }

    .list-announce { text-align: center; font-size: 12px; color: var(--tint); padding: 2px 0 10px; }
    .network-counts { text-align: center; font-size: 12px; color: var(--ink-quiet); padding: 12px 0 4px; }
  </style>
  <script src="/show-renderer.js"></script>
  <script>
    // Set nav context before loading nav.js
    window.navContext = { page: 'groups', backLabel: 'Groups' };
  </script>
  <script src="/nav.js"></script>
  <script src="/shell.js?v=2" defer></script>
  <script src="/app-banner.js?v=4" defer></script>
</head>
<body>
  <header>
    <div class="header-top">
      <a id="backLink" class="back" href="#" style="display: none;"></a>
      <h1 id="pageTitle">Groups</h1>
    </div>
  </header>

  <main>
    <!-- Groups List (root view) -->
    <div id="groupsList">
      <div style="margin-bottom: 20px;">
        <button style="background: var(--tint); color: white; border: none; padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; margin-right: 8px;" onclick="showCreateGroupModal()">Create Group</button>
        <button style="background: var(--tint); color: white; border: none; padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer;" onclick="showJoinFlow()">Join a Group</button>
      </div>
      <div id="groupsContainer"></div>
      <div id="emptyGroups" class="empty-state" style="display: none;">
        <h3>No groups yet</h3>
        <p>Create or join a group to get started.</p>
      </div>
    </div>

    <!-- Group View (members + trending) -->
    <div id="groupView">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;">
        <h2 id="groupViewTitle" style="margin: 0; font-size: 22px; font-weight: 600;"></h2>
        <button id="groupMenuBtn" onclick="toggleGroupMenu()" style="background: none; border: none; font-size: 20px; cursor: pointer; padding: 8px;">⋯</button>
      </div>
      <div id="groupMenu" style="display: none; background: var(--surface-2); border-radius: 8px; padding: 8px; margin-bottom: 20px;">
        <button id="inviteBtn" onclick="showInviteModal()" style="display: block; width: 100%; text-align: left; padding: 12px; background: none; border: none; cursor: pointer; font-size: 14px; margin-bottom: 8px;">Invite Members</button>
        <button id="leaveBtn" onclick="leaveGroup()" style="display: block; width: 100%; text-align: left; padding: 12px; background: none; border: none; cursor: pointer; font-size: 14px; margin-bottom: 8px;">Leave Group</button>
        <button id="deleteBtn" onclick="deleteGroup()" style="display: none; width: 100%; text-align: left; padding: 12px; background: none; border: none; cursor: pointer; font-size: 14px; color: #d32f2f;">Delete Group</button>
      </div>
      <h3 style="margin: 0 0 12px; font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-quiet);">Members</h3>
      <div id="groupMembersList"></div>
      <h3 style="margin: 20px 0 12px; font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-quiet);">Group Trending</h3>
      <div id="groupTrendingList"></div>
    </div>

    <!-- Member View (list tabs + shows) -->
    <div id="memberView">
      <h2 id="memberViewTitle" style="margin: 0 0 16px; font-size: 22px; font-weight: 600;"></h2>
      <div class="list-tabs" id="listTabs"></div>
      <div id="memberShowsList"></div>
    </div>

    <!-- Show Detail -->
    <div id="showDetail">
      <h2 id="showDetailTitle" style="margin: 0 0 20px; font-size: 22px; font-weight: 600;"></h2>
      <div id="showDetailContent" style="margin-bottom: 40px;"></div>
    </div>

    <!-- Join Flow -->
    <div id="joinFlow">
      <div class="join-section">
        <h2>Join a Group</h2>
        <p>Enter the invite code to join a group</p>
        <div class="join-input-row">
          <input id="joinTokenInput" type="text" placeholder="Invite code" maxlength="24">
          <button onclick="joinGroup()">Join</button>
        </div>
        <p id="joinStatus" style="font-size: 12px; color: var(--ink-muted); margin: 0;"></p>
      </div>
    </div>
  </main>

  <!-- Create Group Modal -->
  <div id="createGroupModal" class="modal-overlay">
    <div class="modal">
      <h2>Create a Group</h2>
      <input id="groupNameInput" type="text" placeholder="Group name" maxlength="100">
      <div class="modal-buttons">
        <button class="btn-cancel" onclick="closeCreateGroupModal()">Cancel</button>
        <button class="btn-submit" onclick="createGroup()">Create</button>
      </div>
    </div>
  </div>

  <!-- Invite Modal -->
  <div id="inviteModal" class="modal-overlay">
    <div class="modal">
      <h2>Invite to Group</h2>
      <p style="color: var(--ink-muted); font-size: 13px; margin: 0 0 16px;">Share this link with people you want to invite:</p>
      <div style="display: flex; gap: 8px; align-items: center;">
        <input id="inviteLinkInput" class="invite-link-input" type="text" readonly>
        <button id="copyInviteLinkBtn" class="invite-link-btn" onclick="copyInviteLink()">Copy</button>
      </div>
      <p id="inviteLinkExpire" style="color: var(--ink-muted); font-size: 12px; margin: 12px 0 0;"></p>
      <div class="modal-buttons" style="margin-top: 20px;">
        <button class="btn-cancel" onclick="closeInviteModal()" style="flex: 1;">Done</button>
      </div>
    </div>
  </div>

  <script>
    // Stack-based navigation
    let navStack = [];
    let authMember = null;
    let currentGroupData = null;
    let currentMemberSlug = null;
    let currentListType = 'watching';
    let currentMemberShows = [];
    let detailShow = null;
    let detailMyCopy = null;
    let detailActors = [];

    const ALL_LISTS = ['watching', 'waiting', 'recommending', 'next'];
    const LIST_LABELS = {
      watching: 'Watching',
      waiting: 'Awaiting',
      recommending: 'Loved',
      next: 'Next Up'
    };

    // Initialize on page load
    (async () => {
      try {
        const res = await fetch('/auth/check');
        if (res.ok) {
          const data = await res.json();
          authMember = data.member;
          if (!authMember) {
            window.location.href = '/';
            return;
          }
          const params = new URLSearchParams(window.location.search);
          const joinToken = params.get('token');
          if (joinToken) {
            showJoinPreview(joinToken);
          } else {
            navPush('groupsList', loadGroupsList);
          }
        } else {
          window.location.href = '/';
        }
      } catch (e) {
        console.error('Auth check failed:', e);
        window.location.href = '/';
      }
    })();

    // Navigation stack management
    function navPush(view, loadFn) {
      navStack.push(view);
      updateNav();
      if (loadFn) loadFn();
    }

    function navBack() {
      if (navStack.length > 1) {
        navStack.pop();
        updateNav();
        const view = navStack[navStack.length - 1];
        if (view === 'groupsList') loadGroupsList();
        else if (view === 'groupView') renderGroupView();
        else if (view === 'memberView') renderMemberView();
      }
    }

    function updateNav() {
      const view = navStack[navStack.length - 1];
      document.getElementById('groupsList').style.display = view === 'groupsList' ? 'block' : 'none';
      document.getElementById('groupView').style.display = view === 'groupView' ? 'block' : 'none';
      document.getElementById('memberView').style.display = view === 'memberView' ? 'block' : 'none';
      document.getElementById('showDetail').style.display = view === 'showDetail' ? 'block' : 'none';
      document.getElementById('joinFlow').style.display = view === 'joinFlow' ? 'block' : 'none';

      // Update shared nav label based on current view
      let backLabel = 'Groups';
      if (navStack.length > 1) {
        const currentView = view;
        if (currentView === 'groupView' && currentGroupData) {
          backLabel = 'Groups';
        } else if (currentView === 'memberView' && currentMemberSlug) {
          // Get member name from currentGroupData if available
          const member = currentGroupData?.members?.find(m => m.slug === currentMemberSlug);
          backLabel = member?.first_name || currentMemberSlug;
        } else if (currentView === 'showDetail' && detailShow) {
          backLabel = detailShow.title;
        }
      }
      window.updateNavLabel(backLabel);
    }

    // Views
    async function loadGroupsList() {
      try {
        const res = await fetch('/api/groups');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        document.getElementById('pageTitle').textContent = 'Groups';
        const container = document.getElementById('groupsContainer');
        const empty = document.getElementById('emptyGroups');

        if (data.groups.length === 0) {
          container.innerHTML = '';
          empty.style.display = 'block';
          return;
        }
        empty.style.display = 'none';
        container.innerHTML = data.groups.map(g => `
          <div class="group-card" onclick="openGroup(${g.id})">
            <h3>${escapeHtml(g.name)}</h3>
            <p>${g.member_count} member${g.member_count !== 1 ? 's' : ''}</p>
          </div>
        `).join('');
      } catch (e) {
        console.error('Failed to load groups:', e);
        document.getElementById('groupsContainer').innerHTML = '<p>Error loading groups. Try again.</p>';
      }
    }

    async function openGroup(groupId) {
      try {
        const res = await fetch(`/api/groups/${groupId}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        currentGroupData = data;
        currentMemberSlug = null;
        currentListType = 'watching';
        navPush('groupView', renderGroupView);
      } catch (e) {
        console.error('Failed to load group:', e);
        alert('Error loading group');
      }
    }

    async function renderGroupView() {
      if (!currentGroupData) return;
      document.getElementById('pageTitle').textContent = currentGroupData.group.name;
      document.getElementById('groupViewTitle').textContent = currentGroupData.group.name;
      document.getElementById('deleteBtn').style.display = currentGroupData.is_creator ? 'block' : 'none';

      // Members
      const membersList = document.getElementById('groupMembersList');
      membersList.innerHTML = currentGroupData.members.map(m => `
        <div class="member-row" onclick="openMember('${escapeHtml(m.slug)}')">
          <h4>${escapeHtml(m.first_name || m.slug)}</h4>
          <p>${m.show_count} show${m.show_count !== 1 ? 's' : ''}</p>
        </div>
      `).join('');

      // Trending
      try {
        const res = await fetch(`/api/groups/${currentGroupData.group.id}/trending`);
        if (res.ok) {
          const data = await res.json();
          const shows = data.shows || [];
          // Add member names as caption for each show
          const showsWithMembers = shows.map(s => ({
            ...s,
            _memberCaption: s.members && s.members.length > 0 ? s.members.join(', ') : ''
          }));
          document.getElementById('groupTrendingList').innerHTML = showsWithMembers.map(show =>
            renderShowCard(show, {
              onClickId: openShowFromList,
              showRating: true,
              showChevron: true,
              caption: show._memberCaption
            })
          ).join('');
        }
      } catch (e) {
        console.error('Failed to load trending:', e);
      }
    }

    async function openMember(memberSlug) {
      currentMemberSlug = memberSlug;
      currentListType = 'watching';
      try {
        const res = await fetch(`/api/shows?member=${encodeURIComponent(memberSlug)}`);
        if (res.ok) {
          const data = await res.json();
          currentMemberShows = data.shows || [];
        }
      } catch (e) {
        console.error('Failed to load member shows:', e);
        currentMemberShows = [];
      }
      navPush('memberView', renderMemberView);
    }

    function renderMemberView() {
      if (!currentMemberSlug) return;
      const member = currentGroupData.members.find(m => m.slug === currentMemberSlug);
      document.getElementById('pageTitle').textContent = member?.first_name || currentMemberSlug;
      document.getElementById('memberViewTitle').textContent = `${member?.first_name || currentMemberSlug}'s Shows`;

      // List tabs
      const tabs = document.getElementById('listTabs');
      tabs.innerHTML = ALL_LISTS.map(list => `
        <button class="list-tab${list === currentListType ? ' active' : ''}" onclick="switchList('${list}')">
          ${LIST_LABELS[list]}
        </button>
      `).join('');

      // Shows for current list
      const filtered = currentMemberShows.filter(s => s.list === currentListType && !s.archived);
      document.getElementById('memberShowsList').innerHTML = renderShowList(filtered, {
        onClickId: openShowFromList,
        showRating: true,
        showChevron: true,
        currentTab: currentListType
      });
    }

    function switchList(list) {
      currentListType = list;
      renderMemberView();
    }

    async function openShowFromList(showId) {
      detailShow = null;
      detailMyCopy = null;
      detailActors = [];

      try {
        const res = await fetch('/api/shows/' + showId);
        if (res.ok) {
          const data = await res.json();
          detailShow = data.show;
        }
        if (!detailShow) return;

        try {
          const ar = await fetch('/api/shows/' + showId + '/actors');
          if (ar.ok) {
            const ad = await ar.json();
            detailActors = ad.actors || [];
          }
        } catch {}

        await resolveMyCopy(detailShow);
        navPush('showDetail', renderShowDetail);
      } catch (e) {
        console.error('Failed to load show:', e);
      }
    }

    async function resolveMyCopy(show) {
      detailMyCopy = null;
      if (!authMember || !show) return;
      try {
        const res = await fetch(`/api/shows?member=${encodeURIComponent(authMember.slug)}&include_archived=1`);
        if (!res.ok) return;
        const d = await res.json();
        const t = (show.title || '').toLowerCase();
        detailMyCopy = (d.shows || []).find(s => (s.title || '').toLowerCase() === t) || null;
      } catch {}
    }

    function renderShowDetail() {
      if (!detailShow) return;
      document.getElementById('pageTitle').textContent = detailShow.title;
      document.getElementById('showDetailTitle').textContent = detailShow.title;

      const loggedIn = !!authMember;
      let html = '';

      // Poster/backdrop
      if (detailShow.backdrop_url) {
        html += `<div style="width:100%;margin-bottom:16px;"><img src="${safeUrl(detailShow.backdrop_url)}" alt="" loading="lazy" style="width:100%;border-radius:10px;display:block;"></div>`;
      } else if (detailShow.poster_url) {
        html += `<div style="margin-bottom:16px;"><img src="${safeUrl(detailShow.poster_url)}" alt="" loading="lazy" style="width:100%;border-radius:10px;display:block;"></div>`;
      }

      // Overview
      if (detailShow.overview) {
        html += `<div style="margin-bottom:16px;color:var(--ink);font-size:15px;line-height:1.6;">${escapeHtml(detailShow.overview)}</div>`;
      }

      // Network/Watch
      if (detailShow.network) {
        const realUrl = detailShow.network_url && !detailShow.network_url.includes('/search') && !detailShow.network_url.includes('/s?') && !detailShow.network_url.includes('?q=') && !detailShow.network_url.includes('?query=');
        const linkHtml = realUrl
          ? `<a href="${safeUrl(detailShow.network_url)}" target="_blank" rel="noopener" style="color:var(--tint);text-decoration:none;">Watch on ${escapeHtml(detailShow.network)}</a>`
          : (detailShow.watch_link
              ? `${escapeHtml(detailShow.network)} · <a href="${safeUrl(detailShow.watch_link)}" target="_blank" rel="noopener" style="color:var(--tint);text-decoration:none;">Where to watch</a>`
              : escapeHtml(detailShow.network));
        html += `<div style="margin-bottom:12px;padding:12px;background:var(--surface-2);border-radius:8px;"><strong>Network:</strong> ${linkHtml}</div>`;
      }

      // Trailer
      if (detailShow.trailer_key) {
        html += `<div style="margin-bottom:12px;"><a href="https://www.youtube.com/watch?v=${encodeURIComponent(detailShow.trailer_key)}" target="_blank" rel="noopener" style="color:var(--tint);text-decoration:none;">▶ Watch trailer</a></div>`;
      }

      // Cast
      if (detailActors.length || detailShow.director) {
        html += `<div style="margin-bottom:16px;padding:12px;background:var(--surface-2);border-radius:8px;">`;
        if (detailShow.director) {
          const dirVal = (detailShow.director_imdb_id && !detailShow.director.includes(','))
            ? `<a href="https://www.imdb.com/name/${encodeURIComponent(detailShow.director_imdb_id)}/" target="_blank" rel="noopener" style="color:var(--tint);text-decoration:none;">${escapeHtml(detailShow.director)}</a>`
            : escapeHtml(detailShow.director);
          html += `<div style="margin-bottom:8px;"><strong>${detailShow.movie ? 'Director' : 'Creator'}:</strong> ${dirVal}</div>`;
        }
        if (detailActors.length) {
          const cast = detailActors.map(a => a.imdb_id
            ? `<a href="https://www.imdb.com/name/${encodeURIComponent(a.imdb_id)}/" target="_blank" rel="noopener" style="color:var(--tint);text-decoration:none;">${escapeHtml(a.name)}</a>`
            : escapeHtml(a.name)).join(', ');
          html += `<div><strong>Cast:</strong> ${cast}</div>`;
        }
        html += `</div>`;
      }

      // My Lists
      if (loggedIn && authMember) {
        const curList = (detailMyCopy && !detailMyCopy.archived) ? detailMyCopy.list : null;
        const chips = ALL_LISTS.map(l => `
          <button style="padding:10px 16px;border:1px solid var(--border-soft);border-radius:8px;background:${l === curList ? 'var(--tint)' : 'var(--surface-2)'};color:${l === curList ? 'white' : 'var(--ink)'};font-weight:500;cursor:pointer;margin-right:8px;margin-bottom:8px;" onclick="detailChip('${l}')">
            ${LIST_LABELS[l]}
          </button>
        `).join('');
        html += `<div style="margin-bottom:16px;padding:12px;background:var(--surface-2);border-radius:8px;">
          <div style="font-weight:600;margin-bottom:12px;">My Lists</div>
          ${chips}`;
        if (detailMyCopy && detailMyCopy.archived) {
          html += `<div style="margin-top:8px;color:var(--ink-muted);font-size:13px;">Status: Archived</div>`;
        }
        html += `</div>`;
      }

      // Metadata
      const metaRows = [];
      if (detailShow.movie) metaRows.push(`<div><strong>Type:</strong> Movie</div>`);
      if (detailShow.content_rating) metaRows.push(`<div><strong>Rated:</strong> ${escapeHtml(detailShow.content_rating)}</div>`);
      if (detailShow.release_year) metaRows.push(`<div><strong>Year:</strong> ${escapeHtml(String(detailShow.release_year))}</div>`);
      if (detailShow.genres) metaRows.push(`<div><strong>Genres:</strong> ${escapeHtml(detailShow.genres)}</div>`);
      if (detailShow.runtime) metaRows.push(`<div><strong>Runtime:</strong> ${escapeHtml(detailShow.runtime)} min</div>`);
      if (metaRows.length) {
        html += `<div style="padding:12px;background:var(--surface-2);border-radius:8px;">${metaRows.join('')}</div>`;
      }

      document.getElementById('showDetailContent').innerHTML = html;
    }

    async function detailChip(list) {
      if (!detailMyCopy) {
        await detailAdd(list);
      } else if (detailMyCopy.archived) {
        await detailRestore(detailMyCopy.id, list);
      } else if (detailMyCopy.list === list) {
        return;
      } else {
        await detailMove(detailMyCopy.id, list);
      }
    }

    async function detailAdd(list) {
      if (!detailShow || !authMember) return;
      try {
        const res = await fetch('/api/shows', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title: detailShow.title,
            network: detailShow.network,
            network_url: detailShow.network_url,
            list: list,
            movie: detailShow.movie,
            tmdb_id: detailShow.tmdb_id,
            tmdb_type: detailShow.tmdb_type
          })
        });
        if (!res.ok) return;
        const data = await res.json();
        detailMyCopy = data.show;
        renderShowDetail();
        if (currentMemberSlug) {
          await resolveMemberShows();
          renderMemberView();
        }
      } catch (e) {
        console.error('Failed to add show:', e);
      }
    }

    async function detailMove(id, list) {
      try {
        const res = await fetch(`/api/shows/${id}/move`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ list })
        });
        if (!res.ok) return;
        await resolveMyCopy(detailShow);
        renderShowDetail();
        if (currentMemberSlug) {
          await resolveMemberShows();
          renderMemberView();
        }
      } catch (e) {
        console.error('Failed to move show:', e);
      }
    }

    async function detailRestore(id, list) {
      try {
        const res = await fetch(`/api/shows/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ archived: 0, list })
        });
        if (!res.ok) return;
        await resolveMyCopy(detailShow);
        renderShowDetail();
        if (currentMemberSlug) {
          await resolveMemberShows();
          renderMemberView();
        }
      } catch (e) {
        console.error('Failed to restore show:', e);
      }
    }

    async function resolveMemberShows() {
      if (!currentMemberSlug) return;
      try {
        const res = await fetch(`/api/shows?member=${encodeURIComponent(currentMemberSlug)}`);
        if (res.ok) {
          const data = await res.json();
          currentMemberShows = data.shows || [];
        }
      } catch {}
    }

    // Group management
    function toggleGroupMenu() {
      const menu = document.getElementById('groupMenu');
      menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
    }

    function showInviteModal() {
      if (!currentGroupData) return;
      generateNewInvite();
    }

    async function generateNewInvite() {
      try {
        const res = await fetch(`/api/groups/${currentGroupData.group.id}/invite`, { method: 'POST' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        document.getElementById('inviteLinkInput').value = data.url;
        const expiryDate = new Date(data.expires_at).toLocaleDateString();
        document.getElementById('inviteLinkExpire').textContent = `Link expires on ${expiryDate}`;
        document.getElementById('inviteModal').classList.add('open');
        document.getElementById('copyInviteLinkBtn').textContent = 'Copy';
      } catch (e) {
        console.error('Failed to generate invite:', e);
      }
    }

    function closeInviteModal() {
      document.getElementById('inviteModal').classList.remove('open');
    }

    function copyInviteLink() {
      const input = document.getElementById('inviteLinkInput');
      input.select();
      document.execCommand('copy');
      const btn = document.getElementById('copyInviteLinkBtn');
      btn.textContent = 'Copied!';
      setTimeout(() => { btn.textContent = 'Copy'; }, 2000);
    }

    async function leaveGroup() {
      if (!confirm('Leave this group?')) return;
      try {
        const res = await fetch(`/api/groups/${currentGroupData.group.id}/leave`, { method: 'POST' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        navStack = ['groupsList'];
        updateNav();
        loadGroupsList();
        toggleGroupMenu();
      } catch (e) {
        console.error('Failed to leave group:', e);
      }
    }

    async function deleteGroup() {
      if (!confirm('Delete this group? This cannot be undone.')) return;
      try {
        const res = await fetch(`/api/groups/${currentGroupData.group.id}`, { method: 'DELETE' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        navStack = ['groupsList'];
        updateNav();
        loadGroupsList();
        toggleGroupMenu();
      } catch (e) {
        console.error('Failed to delete group:', e);
      }
    }

    // Modals
    function showCreateGroupModal() {
      document.getElementById('createGroupModal').classList.add('open');
      document.getElementById('groupNameInput').focus();
    }

    function closeCreateGroupModal() {
      document.getElementById('createGroupModal').classList.remove('open');
      document.getElementById('groupNameInput').value = '';
    }

    async function createGroup() {
      const name = document.getElementById('groupNameInput').value.trim();
      if (!name) {
        alert('Please enter a group name');
        return;
      }
      try {
        const res = await fetch('/api/groups', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name })
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        closeCreateGroupModal();
        document.getElementById('inviteLinkInput').value = data.invite.url;
        document.getElementById('inviteLinkExpire').textContent = `Link expires on ${new Date(data.invite.expires_at).toLocaleDateString()}`;
        document.getElementById('inviteModal').classList.add('open');
        setTimeout(loadGroupsList, 500);
      } catch (e) {
        console.error('Failed to create group:', e);
      }
    }

    function showJoinFlow() {
      navPush('joinFlow', () => {
        document.getElementById('pageTitle').textContent = 'Join a Group';
        document.getElementById('joinTokenInput').focus();
      });
    }

    async function showJoinPreview(token) {
      try {
        const res = await fetch(`/api/groups/join?token=${encodeURIComponent(token)}`);
        if (!res.ok) {
          window.location.href = '/groups';
          return;
        }
        const data = await res.json();
        if (data.join_required) {
          navPush('joinFlow', () => {
            document.getElementById('pageTitle').textContent = 'Join a Group';
            document.getElementById('joinTokenInput').value = token;
          });
        } else if (data.ok) {
          window.location.href = '/groups';
        }
      } catch (e) {
        console.error('Failed to preview invite:', e);
        window.location.href = '/groups';
      }
    }

    async function joinGroup() {
      const token = document.getElementById('joinTokenInput').value.trim();
      if (!token) {
        alert('Please enter an invite code');
        return;
      }
      try {
        const res = await fetch(`/api/groups/join?token=${encodeURIComponent(token)}`);
        if (res.status === 409) {
          alert('You\'re already in this group');
          return;
        }
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        alert('Successfully joined the group!');
        navStack = ['groupsList'];
        updateNav();
        loadGroupsList();
      } catch (e) {
        console.error('Failed to join group:', e);
      }
    }

    // Global click handler for show renderer
    window.__showRendererClickHandler = (showId) => {
      openShowFromList(showId);
    };
  </script>
</body>
</html>
