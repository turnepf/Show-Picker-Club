<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rate Your Shows — Show Picker Club</title>
  <meta name="apple-itunes-app" content="app-id=6780282764">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfaf8">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#292522">
  <link rel="stylesheet" href="/styles.css?v=6">
  <style>
    :root { --tint: #6D63EB; }
    @media (prefers-color-scheme: dark) { :root { --tint: #8D87F5; } }
    body { padding: 24px 16px 60px; }
    .wrap { max-width: 720px; margin: 0 auto; }
    .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; position: relative; }
    .topbar a.back { color: var(--tint); text-decoration: none; font-size: 16px; position: relative; z-index: 1; padding: 4px 8px 4px 0; }
    .topbar h1 {
      font-family: var(--font-sans); font-size: 17px; font-weight: 600; color: var(--ink);
      position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap;
    }
    .intro { font-size: 13px; color: var(--ink-muted); line-height: 1.5; margin: 0 0 18px; }
    .empty-card { background: var(--surface); border-radius: 10px; padding: 32px; text-align: center; color: var(--ink-muted); font-size: 14px; line-height: 1.6; }
    .err { color: var(--danger-deep); font-size: 13px; text-align: center; padding: 20px; }

  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a class="back" href="/" title="Home">&#8249; Home</a>
      <h1>Rate Your Shows</h1>
    </div>
    <p class="intro">Everything you haven't rated yet, one page — tap a number and it saves instantly, then the show drops off the list. Want to rate a show by season instead of just overall? Tap "Rate seasons" to open its detail page.</p>
    <div id="content"><div class="empty-card">Loading&hellip;</div></div>
    <div class="footer" id="footer"></div>
  </div>

  <script src="/show-renderer.js?v=2"></script>
  <script src="/shell.js?v=3" defer></script>
  <script>

    let mySlug = null;
    const LIST_LABELS = { watching: 'Watching', waiting: 'Awaiting', recommending: 'Loved' };

    function ratingRowHtml(id) {
      let segs = '';
      for (let i = 1; i <= 10; i++) {
        segs += `<div class="rating-seg" onclick="rate(${id}, ${i})"></div>`;
      }
      return `<div class="rating-row" id="rating-row-${id}">${segs}</div>`;
    }

    function rowMeta(show) {
      const parts = [];
      // Archived rows are in the backlog too; say so rather than naming a
      // list the show no longer appears on.
      if (show.archived) parts.push('Archived');
      else if (LIST_LABELS[show.list]) parts.push(LIST_LABELS[show.list]);
      let meta = escapeHtml(parts.join(' · '));
      if (!show.movie && show.seasons_released && mySlug) {
        meta += ` <a href="/${encodeURIComponent(mySlug)}?show=${show.id}">Rate seasons &rarr;</a>`;
      } else if (mySlug) {
        meta += ` <a href="/${encodeURIComponent(mySlug)}?show=${show.id}">View &rarr;</a>`;
      }
      return meta;
    }

    const DONE_MESSAGE = `<div class="empty-card">You've rated everything in your backlog — nice work! Season ratings aren't tracked here; open a show's detail page for those.</div>`;

    // Only unrated shows are listed (overall rating; season ratings don't
    // count) — once a show's rated it no longer belongs in this list, so
    // rate() removes its row instead of just updating it in place.
    function render(shows, hasAny) {
      const content = document.getElementById('content');
      if (!shows.length) {
        content.innerHTML = hasAny
          ? DONE_MESSAGE
          : `<div class="empty-card">Nothing to rate yet — add some shows to Watching, Awaiting, or Loved first.</div>`;
        return;
      }
      // Ordinary show cards (show-renderer.js) with the tap-row dropped in
      // under the text. No TMDB rating on the right and no chevron: the
      // point of this row is the score you're about to give it, and a "★ 8.3"
      // sitting beside an empty tap-row reads as one.
      content.innerHTML = '<div class="show-list">' + shows.map(show => renderShowCard(show, {
        showRating: false,
        showChevron: false,
        caption: rowMeta(show),
        extraHtml: ratingRowHtml(show.id),
      })).join('') + '</div>';
    }

    async function rate(id, value) {
      const row = document.getElementById(`rating-row-${id}`);
      if (row) [...row.children].forEach((seg, i) => seg.classList.toggle('filled', i < value));
      try {
        const res = await fetch(`/api/shows/${id}/rating`, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ rating: value }),
        });
        if (!res.ok) { load(); return; }
        // Rated — it no longer belongs in this unrated-only list. A short
        // pause so the filled tap-row is visible for a beat before the row
        // leaves, rather than vanishing the instant it's tapped.
        setTimeout(() => {
          const rbRow = document.getElementById(`row-${id}`);
          if (rbRow) rbRow.remove();
          const content = document.getElementById('content');
          if (content && !content.querySelector('.show')) content.innerHTML = DONE_MESSAGE;
        }, 350);
      } catch { load(); }
    }

    async function load() {
      const content = document.getElementById('content');
      try {
        const check = await fetch('/auth/check', {
          headers: { 'X-Client-Platform': window.innerWidth < 768 ? 'web-small' : 'web-large' },
        });
        const checkData = await check.json();
        if (!checkData.authenticated || !checkData.member) {
          content.innerHTML = `<div class="empty-card">
            Log in from your member page first, then come back here to rate your backlog.
          </div>`;
          return;
        }
        mySlug = checkData.member;

        const res = await fetch('/api/rate-backlog');
        if (res.status === 401) {
          content.innerHTML = `<div class="empty-card">
            Log in from your member page first, then come back here to rate your backlog.
          </div>`;
          return;
        }
        if (!res.ok) { content.innerHTML = `<div class="err">Failed to load (${res.status}).</div>`; return; }
        const data = await res.json();
        render(data.shows || [], !!data.has_any);
      } catch (e) {
        content.innerHTML = `<div class="err">Failed to load: ${escapeHtml(e.message || e)}</div>`;
      }
    }

    load();
  </script>
</body>
</html>
