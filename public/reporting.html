<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Show Picker Club Reporting</title>
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfaf8">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#292522">
  <link rel="stylesheet" href="/styles.css?v=6">
  <style>
    /* The native app's tint, so chrome matches iOS. */
    :root { --tint: #6D63EB; }
    @media (prefers-color-scheme: dark) { :root { --tint: #8D87F5; } }
    body { padding: 24px 16px 60px; }
    .wrap { max-width: 960px; margin: 0 auto; }
    .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; position: relative; }
    .topbar a.back { color: var(--tint); text-decoration: none; font-size: 16px; padding: 4px 8px 4px 0; position: relative; z-index: 1; white-space: nowrap; }
    .topbar h1 {
      font-family: var(--font-sans); font-size: 17px; font-weight: 600; color: var(--ink);
      position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap;
    }
    .subtitle { font-size: 13px; color: var(--ink-muted); margin-bottom: 24px; text-align: center; }

    .err { color: var(--danger-deep); font-size: 13px; margin-top: 12px; text-align: center; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .card {
      background: var(--surface);
      border-radius: 8px;
      padding: 16px 12px;
      border: 1px solid var(--border-soft);
    }
    .card h3 {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
      color: var(--ink-muted); margin-bottom: 12px; font-weight: 600; text-align: center;
    }
    .metrics { display: flex; gap: 2px; }
    .metric { flex: 1; min-width: 0; text-align: center; padding: 4px 2px; }
    .metric-val {
      font-size: 20px; font-weight: 700; color: var(--ink);
      font-variant-numeric: tabular-nums; line-height: 1.1;
    }
    .metric-lbl {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.4px;
      color: var(--ink-muted); margin-top: 4px;
    }
    .stat-row { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 0; font-size: 14px; }
    .stat-row .lbl { color: var(--ink-muted); }
    .stat-row .val { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }

    .section {
      background: var(--surface);
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 16px;
      border: 1px solid var(--border-soft);
    }
    .section h2 {
      font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;
      color: var(--ink-muted); margin-bottom: 12px; font-weight: 600;
    }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { text-align: left; font-weight: 500; color: var(--ink-muted); padding: 6px 8px; border-bottom: 1px solid var(--border); font-size: 12px; }
    td { padding: 8px; border-bottom: 1px solid var(--border-soft); }
    td.num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; }
    tr:last-child td { border-bottom: none; }

    .empty { color: var(--ink-faint); font-style: italic; font-size: 13px; padding: 8px 0; }
    .footer { text-align: center; color: var(--ink-faint); font-size: 12px; margin-top: 32px; }
  </style>
  <!-- iOS skin: recessed page, sticky nav bar, soft fully-rounded cards. -->
  <style id="ios-skin">
    body { background: var(--surface-2); }
    .card, .section { border: none; border-radius: 14px; box-shadow: var(--shadow-card); }
    .topbar {
      position: sticky; top: 0; z-index: 10;
      /* No negative top bleed — the admin nav sits above the sticky bar now. */
      margin: 0 -16px 16px; padding: 12px 16px;
      background: color-mix(in srgb, var(--surface-2) 86%, transparent);
      backdrop-filter: saturate(180%) blur(12px);
      -webkit-backdrop-filter: saturate(180%) blur(12px);
      border-bottom: 1px solid var(--border-soft);
    }
  </style>
  <script src="/shell.js?v=3" defer></script>
</head>
<body>
  <div class="wrap">
    <nav class="admin-nav">
      <a href="/" class="back" aria-label="Back to Show Picker Club">&#9664;<span class="back-label">Home</span></a>
      <a href="/members">Members</a>
      <a href="/url-cleanup">Show Cleanup</a>
      <a href="/vibe-admin">Vibe admin</a>
      <a href="/reporting" class="current">Reporting</a>
    </nav>
    <div class="topbar">
      <h1>Reporting</h1>
    </div>
    <div class="subtitle" id="generated">Loading…</div>
    <div id="content"></div>
    <div id="loadErr" class="err"></div>
  </div>

  <script>
    function fmt(n) { return (n || 0).toLocaleString(); }
    function fmtDate(iso) {
      const d = new Date(iso);
      return d.toLocaleString(undefined, { dateStyle: 'short', timeStyle: 'short' });
    }
    function memberLabel(m) {
      const name = m.first_name || m.slug;
      return m.last_initial ? `${name} ${m.last_initial}` : name;
    }

    function windowCard(title, w) {
      return `<div class="card">
        <h3>${title}</h3>
        <div class="metrics">
          <div class="metric"><div class="metric-val">${fmt(w.week)}</div><div class="metric-lbl">Week</div></div>
          <div class="metric"><div class="metric-val">${fmt(w.month)}</div><div class="metric-lbl">Month</div></div>
          <div class="metric"><div class="metric-val">${fmt(w.all_time)}</div><div class="metric-lbl">All Time</div></div>
        </div>
      </div>`;
    }

    function dwmCard(title, w) {
      return `<div class="card">
        <h3>${title}</h3>
        <div class="metrics">
          <div class="metric"><div class="metric-val">${fmt(w.day)}</div><div class="metric-lbl">Day</div></div>
          <div class="metric"><div class="metric-val">${fmt(w.week)}</div><div class="metric-lbl">Week</div></div>
          <div class="metric"><div class="metric-val">${fmt(w.month)}</div><div class="metric-lbl">Month</div></div>
        </div>
      </div>`;
    }

    // Friendly labels + a stable display order for the platform breakdown.
    // 'ios' is a legacy value from before iPhone/iPad/Mac were told apart —
    // kept as a fallback until every client has updated.
    const PLATFORM_LABELS = {
      'iphone': 'iPhone',
      'ipad': 'iPad',
      'mac': 'Mac',
      'watchos': 'Apple Watch',
      'tvos': 'Apple TV',
      'web-large': 'Web (large)',
      'web-small': 'Web (small)',
      'ios': 'iOS (legacy)',
      'unknown': 'Unknown',
    };
    const PLATFORM_ORDER = ['iphone', 'ipad', 'mac', 'watchos', 'tvos', 'web-large', 'web-small', 'ios', 'unknown'];

    function platformSection(byPlatform) {
      const bp = byPlatform || {};
      // Union of every platform seen across the day/week/month windows.
      const keys = new Set();
      ['day', 'week', 'month'].forEach(win => {
        Object.keys(bp[win] || {}).forEach(k => keys.add(k));
      });
      if (keys.size === 0) {
        return `<div class="section">
          <h2>Active by platform</h2>
          <div class="empty">No platform data yet. Clients report their platform on each visit; counts will appear here once they do.</div>
        </div>`;
      }
      const ordered = [
        ...PLATFORM_ORDER.filter(k => keys.has(k)),
        ...[...keys].filter(k => !PLATFORM_ORDER.includes(k)).sort(),
      ];
      const rows = ordered.map(k => {
        const label = PLATFORM_LABELS[k] || k;
        return `<tr>
          <td>${label}</td>
          <td class="num">${fmt((bp.day || {})[k])}</td>
          <td class="num">${fmt((bp.week || {})[k])}</td>
          <td class="num">${fmt((bp.month || {})[k])}</td>
        </tr>`;
      }).join('');
      return `<div class="section">
        <h2>Active by platform</h2>
        <table>
          <thead><tr><th>Platform</th><th class="num">Day</th><th class="num">Week</th><th class="num">Month</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
        <div class="footer">Distinct active sessions in each window (a member can use more than one platform).</div>
      </div>`;
    }

    function neverLoggedInSection(list) {
      const rows = list || [];
      const count = rows.length;
      if (count === 0) {
        return `<div class="section">
          <h2>Never logged in</h2>
          <div class="empty">Everyone has logged in at least once since we started tracking it.</div>
        </div>`;
      }
      // "Seeds only" = nothing beyond the seeded rows: no member-added show,
      // no archive, no edit. Show their library size for context.
      const body = rows.map(m => {
        const name = m.name || m.slug;
        const status = m.seeds_only
          ? (m.show_count > 0 ? 'Seeds only' : 'No shows')
          : 'Has activity';
        return `<tr>
          <td>${name}</td>
          <td class="num">${fmt(m.show_count)}</td>
          <td>${status}</td>
        </tr>`;
      }).join('');
      return `<div class="section">
        <h2>Never logged in <span style="color:var(--ink-quiet);font-weight:400;">(${count})</span></h2>
        <table>
          <thead><tr><th>Member</th><th class="num">Shows</th><th>Library</th></tr></thead>
          <tbody>${body}</tbody>
        </table>
        <div class="footer">Members with no login since tracking began (migration 013). "Seeds only" means nothing beyond the seeded rows — no adds, edits, or archives.</div>
      </div>`;
    }

    function renderReport(d) {
      document.getElementById('generated').textContent = 'Generated ' + fmtDate(d.generated_at);

      const totals = d.totals || {};

      const html = `
        <div class="grid">
          ${windowCard('New shows', d.new_shows)}
          ${windowCard('Edits', d.edited_shows)}
          ${windowCard('Archived', d.archived_shows)}
          ${windowCard('New members', d.new_members)}
          ${windowCard('People who rated', d.rating_members)}
          ${dwmCard('Active members', d.active_members || {})}
        </div>

        <div class="section">
          <h2>Totals</h2>
          <div class="grid" style="margin-bottom:0;">
            <div class="card">
              <h3>Members</h3>
              <div class="metrics">
                <div class="metric"><div class="metric-val">${fmt(totals.members)}</div><div class="metric-lbl">Total</div></div>
              </div>
            </div>
            <div class="card">
              <h3>Shows</h3>
              <div class="metrics">
                <div class="metric"><div class="metric-val">${fmt(totals.active_shows)}</div><div class="metric-lbl">Active</div></div>
                <div class="metric"><div class="metric-val">${fmt(totals.archived_shows)}</div><div class="metric-lbl">Archived</div></div>
              </div>
            </div>
            <div class="card">
              <h3>Ratings</h3>
              <div class="metrics">
                <div class="metric"><div class="metric-val">${fmt((d.ratings_submitted || {}).all_time)}</div><div class="metric-lbl">Submitted</div></div>
                <div class="metric"><div class="metric-val">${fmt(d.ratings_titles)}</div><div class="metric-lbl">Titles rated</div></div>
              </div>
            </div>
            <div class="card">
              <h3>By list</h3>
              <div class="metrics">
                <div class="metric"><div class="metric-val">${fmt(totals.watching)}</div><div class="metric-lbl">Watching</div></div>
                <div class="metric"><div class="metric-val">${fmt(totals.waiting)}</div><div class="metric-lbl">Awaiting</div></div>
                <div class="metric"><div class="metric-val">${fmt(totals.recommending)}</div><div class="metric-lbl">Loved</div></div>
                <div class="metric"><div class="metric-val">${fmt(totals.next)}</div><div class="metric-lbl">Next</div></div>
              </div>
            </div>
          </div>
        </div>

        ${platformSection(d.active_by_platform)}

        ${neverLoggedInSection(d.never_logged_in)}

        <div class="section">
          <h2>Top networks</h2>
          ${d.top_networks.length === 0 ? '<div class="empty">None.</div>' : `
            <table>
              <thead><tr><th>Network</th><th class="num">Active shows</th></tr></thead>
              <tbody>
                ${d.top_networks.map(n => `<tr>
                  <td>${n.network}</td>
                  <td class="num">${fmt(n.cnt)}</td>
                </tr>`).join('')}
              </tbody>
            </table>
          `}
        </div>

        <div class="section">
          <h2>Most-shared shows</h2>
          ${d.top_shared.length === 0 ? '<div class="empty">No shows on multiple lists yet.</div>' : `
            <table>
              <thead><tr><th>Show</th><th class="num">Members</th></tr></thead>
              <tbody>
                ${d.top_shared.map(s => `<tr>
                  <td>${s.title}</td>
                  <td class="num">${fmt(s.members)}</td>
                </tr>`).join('')}
              </tbody>
            </table>
          `}
        </div>

        <div class="footer">Edits exclude automated enrichment (tracked separately as enriched_at).</div>
      `;
      document.getElementById('content').innerHTML = html;
    }

    fetch('/api/reporting')
      .then(r => {
        if (r.status === 401) {
          document.getElementById('generated').textContent = '';
          document.getElementById('loadErr').innerHTML = 'Please <a href="/">log in</a> from the homepage to view reporting.';
          return null;
        }
        return r.ok ? r.json() : Promise.reject(`HTTP ${r.status}`);
      })
      .then(data => { if (data) renderReport(data); })
      .catch(err => {
        document.getElementById('generated').textContent = '';
        document.getElementById('loadErr').textContent = 'Failed to load: ' + err;
      });
  </script>
</body>
</html>
