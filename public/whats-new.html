<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>What's New — Show Picker Club</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Show Picker">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- Native Smart App Banner: iPhone/iPad Safari's one prompt for the app
       (OPEN when installed, GET when not). app-banner.js bows out there. -->
  <meta name="apple-itunes-app" content="app-id=6780282764">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfaf8">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#292522">
  <link rel="stylesheet" href="/styles.css?v=5">
  <style>
    /* Light iOS nav bar with a tint back link, matching the app chrome. */
    :root { --tint: #6D63EB; }
    @media (prefers-color-scheme: dark) { :root { --tint: #8D87F5; } }
    body { padding-top: 0; }
    header {
      background: color-mix(in srgb, var(--surface-2) 86%, transparent);
      -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
      color: var(--ink);
      border-bottom: 1px solid var(--border-soft);
      padding: 12px 20px;
      padding-top: calc(12px + env(safe-area-inset-top, 0px));
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-top {
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 720px;
      margin: 0 auto;
      position: relative;
    }
    .header-top a.back {
      color: var(--tint);
      text-decoration: none;
      font-size: 16px;
      line-height: 1;
      padding: 6px 10px 6px 0;
      position: relative; z-index: 1;
    }
    .header-top h1 {
      font-family: var(--font-sans);
      font-size: 17px;
      font-weight: 600;
      position: absolute;
      left: 50%; transform: translateX(-50%);
      white-space: nowrap;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }
    .changelog p { margin: 0; padding: 10px 0; border-bottom: 1px solid var(--border-soft); font-size: var(--text-sm); line-height: 1.6; color: var(--ink-muted); }
    .changelog p:last-child { border-bottom: none; }
    .cl-date { font-weight: 600; color: var(--ink); margin-right: 6px; }
    .cl-title { font-weight: 600; color: var(--ink); margin-right: 4px; }
    .changelog a { color: var(--accent); }
    footer {
      padding: 24px 0 20px;
      font-size: var(--text-xs);
      color: var(--ink-quiet);
      text-align: center;
    }
  </style>
  <!-- iOS skin: recessed page, changelog as one grouped card. -->
  <style id="ios-skin">
    body { background: var(--surface-2); }
    .changelog { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-card); padding: 2px 16px; }
  </style>
  <script src="/shell.js?v=2" defer></script>
  <script src="/app-banner.js?v=3" defer></script>
</head>
<body>
  <header>
    <div class="header-top">
      <a class="back" href="/" title="Home" aria-label="Back to home">&#8249; Home</a>
      <h1>What's New</h1>
    </div>
  </header>

  <main>
    <!-- Rendered from /whats-new.json — the single source of truth shared
         with the native apps. Add entries there, not here. -->
    <div class="changelog" id="changelog"><p>Loading&hellip;</p></div>
    <script>
      (async () => {
        const root = document.getElementById('changelog');
        const esc = s => String(s || '').replace(/[&<>"']/g,
          c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        try {
          const res = await fetch('/whats-new.json');
          const data = await res.json();
          const entry = (e, dateLabel) => {
            const link = e.link
              ? ` <a href="${esc(e.link.url)}">${esc(e.link.label)}</a>`
              : '';
            return `<p><span class="cl-date">${esc(dateLabel)}</span>` +
                   `<span class="cl-title">${esc(e.title)}</span> ${esc(e.body)}${link}</p>`;
          };
          root.innerHTML =
            (data.coming_soon || []).map(e => entry(e, 'Soon')).join('') +
            (data.entries || []).map(e => entry(e, e.date)).join('');
        } catch (e) {
          root.innerHTML = '<p>Couldn&rsquo;t load the changelog. Refresh to try again.</p>';
        }
      })();
    </script>
    

    <footer>
      <div id="platformLine">Web app</div>
      <div>&copy; 2025 Patrick Turner.</div>
    </footer>
    <script>
      // "Web app on Safari on the Mac" — settles "which app am I in?" when a
      // member sends a screenshot. iPadOS Safari masquerades as a Mac; the
      // touch-points check tells them apart. Order matters for the browser:
      // Chrome/Edge UAs also contain "Safari".
      (() => {
        const ua = navigator.userAgent;
        const iPad = /iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
        const device =
          /iPhone/.test(ua) ? 'the iPhone' :
          iPad ? 'the iPad' :
          /Android/.test(ua) ? 'Android' :
          /Macintosh/.test(ua) ? 'the Mac' :
          /Windows/.test(ua) ? 'Windows' : '';
        const browser =
          /Edg/.test(ua) ? 'Edge' :
          /CriOS|Chrome/.test(ua) ? 'Chrome' :
          /FxiOS|Firefox/.test(ua) ? 'Firefox' :
          /Safari/.test(ua) ? 'Safari' : '';
        const installed = navigator.standalone === true ||
          matchMedia('(display-mode: standalone)').matches;
        document.getElementById('platformLine').textContent =
          'Web app' + (installed ? ' installed' : (browser ? ' on ' + browser : '')) +
          (device ? ' on ' + device : '');
      })();
    </script>
  </main>
</body>
</html>
